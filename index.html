  try {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };

    if (sync.mode === 'register') {
      // Check if email already exists
      const checkUrl = `${SUPABASE_URL}/rest/v1/app_users?email=eq.${encodeURIComponent(email)}&select=id`;
      const checkRes = await fetch(checkUrl, { headers });
      const checkRows = await checkRes.json();
      if (checkRows && checkRows.length > 0) {
        throw new Error('该邮箱已被注册');
      }

      // Hash password and insert
      const salt = generateSalt();
      const passwordHash = await hashPassword(password, salt);
      const token = generateToken();

      const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/app_users`, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'return=representation' },
        body: JSON.stringify({
          email: email,
          password_hash: passwordHash,
          salt: salt,
          session_token: token
        })
      });

      if (!insertRes.ok) {
        const errData = await insertRes.json();
        throw new Error(errData.message || '注册失败');
      }

      const insertData = await insertRes.json();
      const user = { id: insertData[0].id, email: email, token: token };
      setAuthSession(user);
      enterApp();

    } else {
      // Login: fetch user by email
      const loginUrl = `${SUPABASE_URL}/rest/v1/app_users?email=eq.${encodeURIComponent(email)}&select=id,email,password_hash,salt,session_token`;
      const loginRes = await fetch(loginUrl, { headers });
      if (!loginRes.ok) throw new Error('登录失败，请重试');
      const rows = await loginRes.json();

      if (!rows || rows.length === 0) {
        throw new Error('账号不存在，请先注册');
      }

      const userRow = rows[0];
      const inputHash = await hashPassword(password, userRow.salt);

      if (inputHash !== userRow.password_hash) {
        throw new Error('密码错误');
      }

      // Generate new session token (invalidate old ones)
      const newToken = generateToken();
      const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${userRow.id}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ session_token: newToken })
      });

      if (!updateRes.ok) throw new Error('登录失败，请重试');

      const user = { id: userRow.id, email: userRow.email, token: newToken };
      setAuthSession(user);
      enterApp();
    }
  } catch(e) {
    errEl.textContent = e.message || '操作失败，请重试';
    btn.disabled = false;
    btn.textContent = sync.mode === 'register' ? '注册' : '登录';
  }
}

async function signOutUser() {
  if (!confirm('确定退出登录吗？')) return;
  // Optionally clear session token on server
  if (sync.user) {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };
    fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${sync.user.id}`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ session_token: null })
    }).catch(() => {});
  }
  const uid = sync.user ? sync.user.id : null;
  clearAuthSession();
  if (sync.timer) { clearInterval(sync.timer); sync.timer = null; }
  if (sync.pushTimer) { clearTimeout(sync.pushTimer); sync.pushTimer = null; }
  if (uid) {
    localStorage.removeItem(`checkin_app_data_${uid}`);
    // 基线指纹跟着账号走：不清掉的话，下次同账号登录时本地缓存已空、
    // 云端指纹又恰好等于旧基线，会被判成「推本地」，用空数据覆盖云端
    localStorage.removeItem('checkin_sync_base_' + uid);
  }
  sync.baseFp = '';
  sync.conflict = null;
  renderSyncConflictBar();
  state = makeEmptyState();
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').textContent = '';
  switchAuthMode('login');
}

function enterApp() {
  document.getElementById('authOverlay').classList.add('hidden');
  const badge = document.getElementById('userBadge');
  if (sync.user && sync.user.email) {
    badge.textContent = sync.user.email;
    badge.title = sync.user.email;
  }
  initApp();
}

// ===== Cloud Sync (user-isolated via session token) =====
/* ==========================================================================
   03 · 云同步：拉取 / 推送 / 状态显示
   整包 JSONB 同步，1.5s 防抖；拉取前先做三方比较，两边都改过就交给用户
   ========================================================================== */
function updateSyncStatus(status, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  const wrapper = document.getElementById('syncStatus');
  if (!dot || !txt) return;
  wrapper.style.display = 'flex';
  dot.className = 'sync-dot ' + status;
  txt.textContent = text;
}

function authHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function fetchCloudData() {
  if (!sync.user) return { ok: false, error: 'not-logged-in' };
  try {
    const url = `${SUPABASE_URL}/rest/v1/checkin_data?user_key=eq.${encodeURIComponent(sync.user.id)}&select=data,updated_at`;
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) return { ok: false, error: 'http-' + res.status };
    const rows = await res.json();
    return { ok: true, row: rows.length > 0 ? rows[0] : null };
  } catch(e) {
    console.error('Fetch cloud error:', e);
    return { ok: false, error: 'network' };
  }
}

// ===== 内容指纹：判断「谁改过」的唯一依据 =====
// 不比时间戳，也不比 _rev 大小：两台设备的时钟会漂，rev 是各自从 0 数的，
// 换设备、清缓存之后完全不可比。只比内容本身。
// 序列化必须先稳定（key 排序），否则云端 JSON 解析出来的 key 顺序与本地不同，
// 一模一样的数据会被算成两个指纹，每次同步都误判成冲突。
function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(v).sort()
    .filter(k => v[k] !== undefined)
    .map(k => JSON.stringify(k) + ':' + stableStringify(v[k]))
    .join(',') + '}';
}

// 同步元信息不参与比对：_rev 每次本地提交都变，_updated_at 每次落盘都变，
// schemaVersion 是结构版本，都不代表「内容改了」
function syncPayload(s) {
  const o = {};
  Object.keys(s || {}).forEach(k => {
    if (k === '_rev' || k === '_updated_at' || k === 'schemaVersion') return;
    o[k] = s[k];
  });
  return o;
}

function stateFingerprint(s) {
  const raw = stableStringify(syncPayload(s));
  let h = 5381;
  for (let i = 0; i < raw.length; i++) h = ((h << 5) + h + raw.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + '-' + raw.length;
}

// 基线指纹存独立 key：它是「这台设备上次看到的一致状态」，
// 不是业务数据，不能跟着 state 一起同步出去
function baseFpKey() {
  return 'checkin_sync_base_' + (sync.user ? sync.user.id : 'anon');
}

function loadBaseFp() {
  try { return localStorage.getItem(baseFpKey()) || ''; } catch(e) { return ''; }
}

function saveBaseFp(fp) {
  sync.baseFp = fp || '';
  try {
    if (fp) localStorage.setItem(baseFpKey(), fp);
    else localStorage.removeItem(baseFpKey());
  } catch(e) {}
}

// 「本机没有值得同步上去的东西」。
// 注意不能只看 categories.length：ensureDietCategory 会给空状态塞一个内置饮食分类，
// 新设备一进来就被判定成「有数据」，那就又回到覆盖云端的歧路上了。
function isEmptyState(s) {
  if (!s) return true;
  const cats = s.categories || [];
  const hasUserCat = cats.some(c => c && !c.builtin);
  const hasItem = cats.some(c => (c.items || []).length > 0);
  const hasRecords = s.records && Object.keys(s.records).length > 0;
  const hasDiets = s.diets && Object.keys(s.diets).length > 0;
  const hasFoods = (s.foods || []).length > 0;
  return !hasUserCat && !hasItem && !hasRecords && !hasDiets && !hasFoods;
}

// 三方比较的唯一判定点。纯函数，便于测试。
//   equal    两边一样，什么都不用做
//   pull     本地没动过 → 用云端
//   push     云端没动过 → 用本地
//   conflict 两边都动过 → 不猜，交给用户
function decideSync(localFp, cloudFp, baseFp, localEmpty) {
  if (localFp === cloudFp) return 'equal';
  // 本机是空的（新设备 / 刚登出重登 / 缓存被清）：没有任何东西值得覆盖云端
  if (localEmpty) return 'pull';
  if (baseFp && localFp === baseFp) return 'pull';
  if (baseFp && cloudFp === baseFp) return 'push';
  // 没有基线又两边都有内容：不猜，交给用户
  return 'conflict';
}

function applyCloudState(cloudData) {
  state = cloudData || makeEmptyState();
  ensureStateShape();
  persist();
  saveBaseFp(stateFingerprint(state));
  paintCurrentTab();   // 云端覆盖本地后，当前屏幕整块重画
}

async function pushCloudData() {
  if (!sync.user || sync.inFlight) return false;
  sync.inFlight = true;
  updateSyncStatus('syncing', '同步中...');
  // 推送期间用户可能又改了数据，基线要记「这次真正推上去的那一版」，
  // 不是请求返回时内存里的那一版，否则下次拉取会误判成云端落后
  const pushedFp = stateFingerprint(state);
  try {
    const url = `${SUPABASE_URL}/rest/v1/checkin_data?on_conflict=user_key`;
    const payload = {
      user_key: sync.user.id,
      data: state,
      updated_at: new Date().toISOString()
    };
    const res = await fetch(url, {
      method: 'POST',
      headers: { ...authHeaders(), 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(payload)
    });
    sync.inFlight = false;
    if (res.ok) {
      updateSyncStatus('online', '已同步');
      sync.lastAt = Date.now();
      saveBaseFp(pushedFp);   // 推上去的这版就是新的共同基线
      return true;
    } else {
      updateSyncStatus('offline', '同步失败');
      return false;
    }
  } catch(e) {
    sync.inFlight = false;
    updateSyncStatus('offline', '网络错误');
    return false;
  }
}

function scheduleCloudPush() {
  if (!sync.user) return;
  if (sync.conflict) return;   // 冲突未裁决前不推，免得把另一台设备的改动冲掉
  if (sync.pushTimer) clearTimeout(sync.pushTimer);
  sync.pushTimer = setTimeout(() => pushCloudData(), 1500);
}

async function syncFromCloud() {
  if (!sync.user || sync.inFlight) return;
  if (sync.conflict) { renderSyncConflictBar(); return; }   // 等用户裁决，不自动处理
  updateSyncStatus('syncing', '同步中...');
  const res = await fetchCloudData();

  // 请求失败和「云端确实没有数据」必须分开：
  // 以前两者都返回 null，断网时会把本地旧数据当成权威推上去
  if (!res.ok) {
    updateSyncStatus('offline', res.error === 'network' ? '网络错误' : '同步失败');
    return;
  }

  if (!res.row) {
    // 云端还没有这条记录：本设备也没有缓存 → 新用户，种默认数据
    // 否则把本地数据推上去
    if (!localStorage.getItem(getStorageKey())) {
      loadDefaultData();
      saveBaseFp(stateFingerprint(state));
    } else {
      await pushCloudData();
    }
    return;
  }

  const cloudData = res.row.data || {};
  const act = decideSync(stateFingerprint(state), stateFingerprint(cloudData), loadBaseFp(), isEmptyState(state));
  if (act === 'pull') {
    applyCloudState(cloudData);
    updateSyncStatus('online', '已同步');
  } else if (act === 'push') {
    await pushCloudData();
  } else if (act === 'equal') {
    saveBaseFp(stateFingerprint(state));
    updateSyncStatus('online', '已同步');
  }
  else {
    showSyncConflict(cloudData, res.row.updated_at);
  }
  sync.lastAt = Date.now();
}

// ===== 冲突提示条：只在「两边都改过」时出现 =====
function showSyncConflict(cloudData, updatedAt) {
  sync.conflict = { data: cloudData, updatedAt: updatedAt || '' };
  updateSyncStatus('conflict', '发现冲突');
  renderSyncConflictBar();
}

function renderSyncConflictBar() {
  const bar = document.getElementById('syncConflictBar');
  if (!bar) return;
  if (!sync.conflict) { bar.style.display = 'none'; return; }
  let when = '';
  if (sync.conflict.updatedAt) {
    const d = new Date(sync.conflict.updatedAt);
    if (!isNaN(d.getTime())) when = d.toLocaleString('zh-CN', { hour12: false });
  }
  bar.style.display = 'flex';
  bar.innerHTML = `
    <span class="conflict-text">⚠️ 另一台设备也改过数据${when ? '（' + escapeHtml(when) + '）' : ''}，两边都有新内容，请选择保留哪一份：</span>
    <span class="conflict-actions">
      <button class="btn btn-outline btn-sm" onclick="resolveSyncConflict('cloud')">用云端的</button>
      <button class="btn btn-primary btn-sm" onclick="resolveSyncConflict('local')">用本机的</button>
    </span>`;
}

async function resolveSyncConflict(choice) {
  const c = sync.conflict;
  if (!c) return;
  sync.conflict = null;
  renderSyncConflictBar();
  if (choice === 'cloud') {
    applyCloudState(c.data);
    updateSyncStatus('online', '已用云端数据覆盖本机');
  } else {
    saveBaseFp('');            // 强制走一次完整推送
    await pushCloudData();
    updateSyncStatus('online', '已用本机数据覆盖云端');
  }
}

function startPeriodicSync() {
  if (sync.timer) clearInterval(sync.timer);
  sync.timer = setInterval(() => {
    if (sync.user && document.visibilityState === 'visible') {
      syncFromCloud();
    }
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && sync.user) {
      syncFromCloud();
    }
  });
}

function renderCloudStatus() {
  const statusDisplay = document.getElementById('cloudStatusDisplay');
  if (sync.user) {
    statusDisplay.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <span class="cloud-status-badge enabled">✅ 已登录</span>
        <button class="btn btn-danger" onclick="signOutUser()">退出登录</button>
      </div>
      <div style="font-size:13px; color:var(--text-muted);">
        当前账号: <code>${escapeHtml(sync.user.email)}</code><br>
        数据自动云端同步，多设备登录即可同步
      </div>
    `;
    // 有冲突在等裁决时不要盖掉「发现冲突」的状态
    if (!sync.conflict) updateSyncStatus('online', '已同步');
  } else {
    statusDisplay.innerHTML = `<span class="cloud-status-badge disabled">未登录</span>`;
  }}

/* ==========================================================================
   04 · 通用工具：id · 日期 · tab 切换
   ========================================================================== */
function genId(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function isToday(date) {
  return formatDate(date) === formatDate(new Date());
}

function getDayLabel(date) {
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(date);
  target.setHours(0,0,0,0);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return '今天';
  if (diff === -1) return '昨天';
  if (diff === 1) return '明天';
  return days[date.getDay()];
}

// ===== Tab Switching =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  ui.tab = tab;
  renderPending = false;   // 切 tab 时立即重画，不等下一帧
  paintCurrentTab();
}

/* ==========================================================================
   04b · 渲染调度：单一写入口
   写操作只改 state，重画什么由这里决定——不要在写函数里手写 renderXxx()。
   ========================================================================== */

// 每个 tab 里有哪些容器。flush 时把当前 tab 的容器全部重画一遍，
// 所以「同屏的两块只刷了一块」这类漏刷，根源上不会再发生。
const TAB_RENDERERS = {
  checkin: [renderCheckin, renderCalendar],
  stats:   [renderStats],
  manage:  [renderManage, renderCloudStatus],
  foods:   [renderFoods]
};

let renderPending = false;

// 唯一的写入口。两种用法等价：
//   commit(() => { state.x = 1; })   改数据 + 提交，推荐
//   state.x = 1; commit();           已经改好了，宣布这批改动结束
// 后者用于改动散落在多个分支里的函数，避免为了包一层 commit 把逻辑拆碎。
function commit(mutate) {
  if (typeof mutate === 'function') mutate();
  state._rev = (Number(state._rev) || 0) + 1;   // 记一笔「本地又改了一版」
  persist();
  scheduleRender();
}

// 一帧内合并多次写入，避免一次操作把同一块界面重画三遍
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(flushRender);
  } else {
    flushRender();   // 测试环境（Node）没有 rAF：同步重画，便于直接断言
  }
}

function flushRender() {
  renderPending = false;
  paintCurrentTab();
  syncOpenModal();
  scheduleCloudPush();
}

// 只重画当前 tab：看不见的 tab 在 switchTab 时会重画，本来就是新的。
// 前后记住滚动位置，整块重绘不该让页面跳回顶部。
function paintCurrentTab() {
  const fns = TAB_RENDERERS[ui.tab] || TAB_RENDERERS.checkin;
  const scroller = document.scrollingElement;
  const top = scroller ? scroller.scrollTop : 0;
  fns.forEach(fn => {
    if (typeof fn !== 'function') return;
    try { fn(); } catch (e) { console.error('render failed:', e); }
  });
  if (scroller && scroller.scrollTop !== top) scroller.scrollTop = top;
}

// 弹窗不在任何 tab 内，单独同步：只有需要跟着数据变的那类弹窗才重画
function syncOpenModal() {
  if (!ui.modal) return;
  if (ui.modal.type === 'dietMeal') renderDietModalLive();
}

/* ==========================================================================
   04c · 追踪条目适配器：渲染层与「分类形态」之间的唯一接缝
   一个分类里「可以打卡的单位」叫 tracked entry：
     普通分类 → 每个未归档的 item 一条
     饮食分类 → 每个餐次一条（设了目标，或当天有记录）
   三个页面的渲染循环因此只认 entry 这个形状，不再问「这是不是饮食」。
   以后加「运动记录」「体重曲线」这类内置分类，只需在 mealEntries 旁边
   再写一组 xxx 函数，并在下面的 CAT_ADAPTERS 里登记一条。
   ========================================================================== */

// 分类形态。全站只有这里知道内置分类与普通分类的差别
function catKind(cat) {
  return (cat && cat.builtin) ? String(cat.builtin) : 'plain';
}

// 一条 entry 的形状（纯数据，不含 HTML）：
//   recorded      当天有没有记录          done      当天有没有达成
//   counted       进不进完成度分母        badge / badgeClass  右侧数值徽章
//   rowClass      行态（checked/done/partial）  extraClass  样式钩子
//   note + noteOnclick                      streak  连续天数
//   onclick       点这一行做什么

// 普通分类：每个未归档的 item 一条
function itemEntries(cat, dateKey) {
  const dayRecs = getDayRecords(dateKey);
  return (cat.items || []).filter(i => !i.archived).map(item => {
    const rec = dayRecs.find(r => r.id === item.id);
    const checked = rec ? isChecked(rec) : false;
    const done = rec ? isDone(rec, item) : false;
    const quant = isQuantItem(item);
    return {
      id: item.id,
      name: item.name,
      recorded: checked,
      done: done,
      counted: true,
      // 普通项只有「打了勾 / 没打勾」两态，量化项才有 done / partial
      rowClass: `${checked ? 'checked' : ''} ${quant ? (done ? 'done' : (checked ? 'partial' : '')) : ''}`,
      extraClass: '',
      badge: quant ? `${rec ? rec.value : 0}/${item.quant.target} ${escapeHtml(item.quant.unit)}` : null,
      badgeClass: quant ? (done ? 'ok' : (checked ? 'low' : '')) : '',
      note: rec ? rec.note : '',
      noteOnclick: `openNoteModal('${item.id}')`,
      streak: getStreak(item.id),
      onclick: quant ? `openQuantInput('${item.id}')` : `toggleCheckin('${item.id}')`
    };
  });
}

// 饮食分类：餐次就是它的「打卡项」。没设目标的那一餐只是入口，不计入分母
function mealEntries(cat, dateKey) {
  return visibleDietMeals(dateKey).map(s => {
    const recorded = s.entries.length > 0;
    return {
      id: DIET_TREND_PREFIX + s.key,
      name: s.name,
      recorded: recorded,
      done: s.reached,
      counted: s.hasGoal,
      rowClass: `${recorded ? 'checked' : ''} ${s.reached ? 'done' : (recorded ? 'partial' : '')}`,
      extraClass: 'diet-meal-item',
      badge: s.hasGoal ? `${s.sum}/${s.goal} 千卡` : `${s.sum} 千卡`,
      badgeClass: s.over ? 'low' : (s.reached ? 'ok' : ''),
      note: getDietMealNote(dateKey, s.key),
      noteOnclick: `openDietNoteModal('${s.key}')`,
      streak: getDietMealStreak(s.key),
      onclick: `openDietMealModal('${s.key}')`
    };
  });
}

// 普通分类：分类名旁没有附加标签
function noTitleTag() { return ''; }

// 每个形态要提供的能力。新增一种内置分类 = 在 CAT_ADAPTERS 里加一条，
// 再写好那六个函数；三个页面的渲染循环一行都不用改。
const CAT_ADAPTERS = {
  plain: {
    entries: itemEntries,             // 打卡页显示哪些行
    statsEntries: itemStatsEntries,   // 统计页的分母与汇总（与日期无关）
    statsRows: itemStatsRows,         // 统计页的每一行
    titleTag: noTitleTag,             // 分类名旁的小标签
    menuExtra: noTitleTag,            // ⋮ 菜单里形态特有的那一项
    manageBody: manageItemRowsHtml    // 管理页卡片内容
  },
  diet: {
    entries: mealEntries,
    statsEntries: dietStatsEntries,
    statsRows: dietStatsRows,
    titleTag: dietTitleTag,
    menuExtra: dietGoalMenuItemHtml,
    manageBody: dietGoalRowsHtml
  }
};

// 全站唯一一处「形态 → 适配器」的映射
function adapterFor(cat) {
  return CAT_ADAPTERS[catKind(cat)] || CAT_ADAPTERS.plain;
}

// 打卡页：某个分类在某天要显示哪些行
function entriesFor(cat, dateKey) { return adapterFor(cat).entries(cat, dateKey); }

// 分类名旁的附加标签（饮食是全天热量合计）
function catTitleTag(cat, dateKey) { return adapterFor(cat).titleTag(cat, dateKey); }

function dietTitleTag(cat, dateKey) {
  const goals = getDietGoals();
  const total = dietTotalKcal(getDietEntries(dateKey));
  const gTotal = goals.total;
  const hasTotal = gTotal != null && gTotal > 0;
  if (!(total > 0 || hasTotal)) return '';
  const over = hasTotal && total > gTotal;
  return `<span class="quant-mini diet-kcal${over ? ' over' : ''}">${hasTotal ? `${total}/${gTotal}` : total} 千卡</span>`;
}

// 统计页：与日期无关的条目清单，分母与「总打卡次数」都用它。
// recordedOn(dateKey) 让汇总循环不必区分打卡项和餐次。
function statsEntriesFor(cat) { return adapterFor(cat).statsEntries(cat); }

// 普通分类：每个打卡项一条（含已归档项，与旧口径一致）
function itemStatsEntries(cat) {
  return (cat.items || []).map(item => ({
    id: item.id,
    name: item.name,
    recordedOn: dk => getDayCheckedIds(dk).includes(item.id)
  }));
}

// 饮食：设了目标的餐次
function dietStatsEntries(cat) {
  return dietGoalMeals().map(key => {
    const m = DIET_MEALS.find(x => x.key === key);
    return {
      id: DIET_TREND_PREFIX + key,
      name: m ? m.name : key,
      recordedOn: dk => dietMealHasEntries(dk, key)
    };
  });
}

/* ==========================================================================
   05 · 打卡页：日期栏 · 日历 · 进度 · 分类卡片
   ========================================================================== */

// ---- Quant helpers ----
function isQuantItem(item) {
  return !!(item && item.quant && item.quant.unit != null && item.quant.target != null);
}
// Normalize a record entry -> { id, value, note } ; plain string treated as value=1 (checked)
function getRecordObj(rec) {
  if (typeof rec === 'object' && rec !== null) {
    return {
      id: rec.id,
      value: rec.value != null ? Number(rec.value) || 0 : 0,
      note: rec.note != null ? String(rec.note) : ''
    };
  }
  return { id: rec, value: 1, note: '' };
}
function getDayRecords(dateKey) {
  return (state.records[dateKey] || []).map(getRecordObj);
}
// Has a check-in record at all.
// A quant record counts as "checked-in" when a non-zero value was recorded;
// a zero value (incl. note-only records) means not checked-in.
// Negative values ARE treated as a real check-in.
function isChecked(rec) {
  return rec.value !== 0;
}
// Quant target met? 'gte' (>=, default) or 'lte' (<=)
function isQuantDone(rec, item) {
  const cmp = (item.quant && item.quant.compare) || 'gte';
  return cmp === 'lte' ? rec.value <= item.quant.target : rec.value >= item.quant.target;
}
// "Done" = checked AND reached target for quant items
function isDone(rec, item) {
  if (!isChecked(rec)) return false;
  if (isQuantItem(item)) return isQuantDone(rec, item);
  return true;
}
function getItemById(itemId) {
  for (const c of state.categories) {
    const it = (c.items || []).find(i => i.id === itemId);
    if (it) return it;
  }
  return null;
}
function getItemCat(itemId) {
  return state.categories.find(c => (c.items || []).some(i => i.id === itemId));
}
// Category participates in overall stats (countInStats defaults to true)
function isCatCounted(cat) {
  return cat.countInStats !== false;
}
function getDayCheckedIds(dateKey) {
  return getDayRecords(dateKey).filter(isChecked).map(r => r.id);
}

function setNote(itemId, note) {
  const dateKey = formatDate(ui.date);
  const item = getItemById(itemId);
  if (!item) return;
  if (!state.records[dateKey]) state.records[dateKey] = [];
  const list = state.records[dateKey];
  const idx = list.findIndex(r => getRecordObj(r).id === itemId);
  const cur = idx > -1 ? getRecordObj(list[idx]) : { id: itemId, value: 0, note: '' };
  const newNote = note.trim();
  if (newNote) {
    const entry = { id: itemId, value: cur.value, note: newNote };
    if (idx > -1) list[idx] = entry; else list.push(entry);
  } else if (idx > -1) {
    // Remove note: keep the check-in record if a non-zero value exists (incl. negatives)
    if (cur.value !== 0) list[idx] = { id: itemId, value: cur.value };
    else list.splice(idx, 1);
  }
  if (list.length === 0) delete state.records[dateKey];
  commit();
}

function changeDate(delta) {
  ui.date.setDate(ui.date.getDate() + delta);
  paintCurrentTab();
}

function goToday() {
  ui.date = new Date();
  ui.calMonth = new Date();
  paintCurrentTab();
}

// ===== Calendar =====
function toggleCalendar() {
  ui.calendarOpen = !ui.calendarOpen;
  const wrap = document.getElementById('calendarWrap');
  const btn = document.getElementById('calToggleBtn');
  if (ui.calendarOpen) {
    ui.calMonth = new Date(ui.date.getFullYear(), ui.date.getMonth(), 1);
    renderCalendar();
    wrap.style.display = 'block';
    btn.style.background = 'var(--primary-light)';
  } else {
    wrap.style.display = 'none';
    btn.style.background = '';
  }
}

function changeCalMonth(delta) {
  ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + delta, 1);
  renderCalendar();
}

// 日历每天的数字：与打卡页口径一致 —— 普通已打卡项 + 饮食已记录餐次
function dayCheckinCount(dateKey) {
  let count = getDayRecords(dateKey).filter(isChecked).length;
  const dcat = getDietCat();
  if (dcat && isCatEnabled(dcat) && !dcat.archived) {
    const entries = getDiets()[dateKey];
    if (Array.isArray(entries) && entries.length) {
      count += DIET_MEAL_KEYS.filter(k => entries.some(e => normMeal(e.meal) === k)).length;
    }
  }
  return count;
}

function renderCalendar() {
  const label = document.getElementById('calMonthLabel');
  label.textContent = `${ui.calMonth.getFullYear()}年${ui.calMonth.getMonth() + 1}月`;

  const grid = document.getElementById('calendarGrid');
  const year = ui.calMonth.getFullYear(), month = ui.calMonth.getMonth();
  const firstDow = new Date(year, month, 1).getDay() || 7; // Mon=1..Sun=7
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = formatDate(new Date());
  const curKey = formatDate(ui.date);

  let html = ['周一','周二','周三','周四','周五','周六','周日'].map(w =>
    `<div class="cal-weekday">${w}</div>`).join('');

  // Leading blanks from previous month
  for (let i = 1; i < firstDow; i++) {
    const d = new Date(year, month, i - firstDow + 1);
    const key = formatDate(d);
    const cnt = dayCheckinCount(key);
    html += `<div class="cal-day other" onclick="selectCalDate('${key}')">
      ${d.getDate()}<div class="cal-count ${cnt === 0 ? 'zero' : ''}">${cnt}</div>
    </div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const cnt = dayCheckinCount(key);
    const cls = ['cal-day'];
    if (key === todayKey) cls.push('today');
    if (key === curKey) cls.push('selected');
    html += `<div class="${cls.join(' ')}" onclick="selectCalDate('${key}')">
      ${day}<div class="cal-count ${cnt === 0 ? 'zero' : ''}">${cnt}</div>
    </div>`;
  }

  grid.innerHTML = html;
}

function selectCalDate(dateKey) {
  ui.date = parseDate(dateKey);
  // Keep calendar open; user closes it by clicking the 📅 button again
  ui.calMonth = new Date(ui.date.getFullYear(), ui.date.getMonth(), 1);
  paintCurrentTab();
}

function toggleCheckin(itemId) {
  const dateKey = formatDate(ui.date);
  const item = getItemById(itemId);
  if (isQuantItem(item)) {
    // Quant items open the value input instead
    openQuantInput(itemId);
    return;
  }
  if (!state.records[dateKey]) state.records[dateKey] = [];
  const idx = state.records[dateKey].findIndex(r => getRecordObj(r).id === itemId);
  if (idx > -1) {
    state.records[dateKey].splice(idx, 1);
    if (state.records[dateKey].length === 0) delete state.records[dateKey];
  } else {
    state.records[dateKey].push(itemId);
  }
  commit();
}

function setQuantValue(itemId, value) {
  const dateKey = formatDate(ui.date);
  const num = Number(value);
  if (!state.records[dateKey]) state.records[dateKey] = [];
  const list = state.records[dateKey];
  const idx = list.findIndex(r => getRecordObj(r).id === itemId);
  const cur = idx > -1 ? getRecordObj(list[idx]) : { id: itemId, value: 0, note: '' };
  if (num !== 0) {
    // Store any non-zero value, including negatives (e.g. weight, profit/loss).
    const entry = { id: itemId, value: num, note: cur.note };
    if (idx > -1) list[idx] = entry; else list.push(entry);
  } else if (idx > -1) {
    list.splice(idx, 1); // value 0 -> remove (clears check-in)
  }
  if (list.length === 0) delete state.records[dateKey];
  commit();
}

function getStreak(itemId) {
  let streak = 0;
  const d = new Date();
  // If today not checked, start from yesterday
  const todayKey = formatDate(d);
  if (!getDayCheckedIds(todayKey).includes(itemId)) {
    d.setDate(d.getDate() - 1);
  }
  while (true) {
    const key = formatDate(d);
    if (getDayCheckedIds(key).includes(itemId)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

// 打卡页的一行。普通项 / 量化项 / 饮食餐次三者结构完全一样：
// 勾选框 + 名称 + 行内备注 + 右侧（数值徽章 · 连续天数 · 备注按钮）。
// 差异只用参数表达：extraClass 区分饮食，badge 有无区分是否量化，onclick 决定点了做什么。
function checkinRowHtml(o) {
  const cls = ['checkin-item', o.extraClass, o.rowClass]
    .filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
  const badge = o.badge == null ? ''
    : `<span class="quant-badge ${o.badgeClass || ''}">${o.badge}</span>`;
  const streak = (o.streak || 0) >= 2 ? `<span class="checkin-streak">🔥 ${o.streak}天</span>` : '';
  return `<div class="${cls}" onclick="${o.onclick}">
        <div class="checkin-checkbox">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span class="checkin-item-name">${escapeHtml(o.name)}</span>
        ${o.noteText || ''}
        <div class="checkin-right">
          ${badge}
          ${streak}
          ${o.noteBtn || ''}
        </div>
      </div>`;
}

// 行内备注：小字文本 + 💬 按钮。三处行渲染共用同一套取值与转义，避免哪一处漏转义。
function checkinNoteParts(note, btnOnclick) {
  const tip = note ? escapeHtml(note).replace(/"/g, '&quot;') : '添加备注';
  return {
    text: note ? `<span class="checkin-note" title="${tip}">${escapeHtml(note)}</span>` : '',
    btn: `<span class="note-btn ${note ? 'has' : ''}" title="${tip}" onclick="event.stopPropagation(); ${btnOnclick}">💬</span>`
  };
}

function renderCheckin() {
  // Date bar
  document.getElementById('dayLabel').textContent = getDayLabel(ui.date);
  document.getElementById('dateValue').textContent =
    `${ui.date.getMonth() + 1}月${ui.date.getDate()}日`;
  document.getElementById('todayBtn').disabled = isToday(ui.date);

  const dateKey = formatDate(ui.date);

  // 归档的、被停用的、开始日期未到的分类都不出现在打卡页
  const activeCats = state.categories.filter(c =>
    !c.archived && isCatEnabled(c) && (!c.startDate || dateKey >= c.startDate));

  // 每张卡片要显示的行先按分类算好，完成度也从这里汇总——
  // 分母只算「可计数条目」，不随当天有没有记录变化，完成率因此不会来回跳
  const cardEntries = new Map();
  activeCats.forEach(cat => cardEntries.set(cat.id, entriesFor(cat, dateKey)));

  let total = 0, done = 0;
  activeCats.forEach(cat => {
    if (!isCatCounted(cat)) return;
    cardEntries.get(cat.id).forEach(e => {
      if (!e.counted) return;
      total++;
      if (e.done) done++;
    });
  });
  const pct = total > 0 ? Math.round(done / total * 100) : 0;

  document.getElementById('progressCount').innerHTML =
    `<span class="done">${done}</span> / ${total}  (${pct}%)`;
  document.getElementById('progressBar').style.width = pct + '%';

  // List
  const list = document.getElementById('checkinList');
  const visibleCats = activeCats.filter(cat => cardEntries.get(cat.id).length > 0);
  if (visibleCats.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📝</div><div class="text">还没有分类，去「分类管理」添加吧</div></div>`;
    return;
  }

  let html = '';
  visibleCats.forEach(cat => {
    const entries = cardEntries.get(cat.id);
    const counted = entries.filter(e => e.counted);
    const catDone = counted.filter(e => e.done).length;
    const notCounted = !isCatCounted(cat);
    html += `<div class="category-card">
      <div class="category-header">
        <span class="category-name">${escapeHtml(cat.name)}${catTitleTag(cat, dateKey)}${notCounted ? ' <span class="nocount-tag">不计统计</span>' : ''}</span>
        <span class="category-count">${catDone}/${counted.length}</span>
      </div>`;
    entries.forEach(e => {
      const noteParts = checkinNoteParts(e.note, e.noteOnclick);
      html += checkinRowHtml({
        name: e.name,
        extraClass: e.extraClass,
        rowClass: e.rowClass,
        noteText: noteParts.text,
        noteBtn: noteParts.btn,
        streak: e.streak,
        badge: e.badge,
        badgeClass: e.badgeClass,
        onclick: e.onclick
      });
    });
    html += `</div>`;
  });

  list.innerHTML = html;
}

/* ==========================================================================
   06 · 统计：周期区间计算
   ========================================================================== */


function fmtDateInput(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function switchPeriod(period) {
  ui.period = period;
  ui.statsOffset = 0;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.period-btn[data-period="${period}"]`);
  if (btn) btn.classList.add('active');

  if (period === 'custom') {
    if (!ui.customRange.start || !ui.customRange.end) {
      const end = new Date(); end.setHours(0, 0, 0, 0);
      const start = new Date(end); start.setDate(end.getDate() - 29);
      ui.customRange.start = fmtDateInput(start);
      ui.customRange.end = fmtDateInput(end);
    }
    const sEl = document.getElementById('statsCustomStart');
    const eEl = document.getElementById('statsCustomEnd');
    if (sEl) sEl.value = ui.customRange.start;
    if (eEl) eEl.value = ui.customRange.end;
  }
  renderStats();
}

function applyStatsCustomRange() {
  const sEl = document.getElementById('statsCustomStart');
  const eEl = document.getElementById('statsCustomEnd');
  const sv = (sEl && sEl.value) || '';
  const ev = (eEl && eEl.value) || '';
  if (!sv || !ev) { showToast('请选择开始和结束日期'); return; }
  if (sv > ev) { showToast('开始日期不能晚于结束日期'); return; }
  ui.customRange.start = sv;
  ui.customRange.end = ev;
  ui.statsOffset = 0;
  renderStats();
}

function changeStatsOffset(delta) {
  ui.statsOffset += delta;
  renderStats();
}

function resetStatsOffset() {
  ui.statsOffset = 0;
  renderStats();
}

function getPeriodRange(period, offset) {
  offset = offset || 0;
  const now = new Date();
  let start, end, totalDays, label;
  if (period === 'custom') {
    let s = ui.customRange.start ? new Date(ui.customRange.start + 'T00:00:00') : null;
    let e = ui.customRange.end ? new Date(ui.customRange.end + 'T00:00:00') : null;
    if (!s || isNaN(s.getTime())) s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
    if (!e || isNaN(e.getTime())) e = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (s > e) { const t = s; s = e; e = t; }
    start = s; end = e;
    totalDays = Math.round((e - s) / 86400000) + 1;
    const sameYear = s.getFullYear() === e.getFullYear();
    label = sameYear
      ? `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`
      : `${s.getFullYear()}/${s.getMonth()+1}/${s.getDate()} - ${e.getFullYear()}/${e.getMonth()+1}/${e.getDate()}`;
    return { start, end, totalDays, label };
  }
  if (period === 'week') {
    start = new Date(now);
    const day = now.getDay() || 7; // Mon=1..Sun=7
    start.setDate(now.getDate() - day + 1 + offset * 7);
    start.setHours(0,0,0,0);
    end = new Date(start);
    end.setDate(start.getDate() + 6);
    totalDays = 7;
    label = `${start.getMonth()+1}/${start.getDate()} - ${end.getMonth()+1}/${end.getDate()}`;
  } else if (period === 'month') {
    start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1 + offset, 0);
    totalDays = end.getDate();
    label = `${start.getFullYear()}年${start.getMonth()+1}月`;
  } else {
    const y = now.getFullYear() + offset;
    start = new Date(y, 0, 1);
    end = new Date(y, 11, 31);
    totalDays = isLeapYear(y) ? 366 : 365;
    label = `${y}年`;
  }
  return { start, end, totalDays, label };
}

function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function countInRange(itemId, start, end) {
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const key = formatDate(d);
    if (getDayCheckedIds(key).includes(itemId)) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

// Days in range where the item reached its quant target (plain items count as checked)
function countDoneInRange(item, start, end) {
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const key = formatDate(d);
    const rec = getDayRecords(key).find(r => r.id === item.id);
    if (rec && isDone(rec, item)) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

// Sum of quant values in range (plain items count 1 per check-in)
function sumValueInRange(item, start, end) {
  let sum = 0;
  const d = new Date(start);
  while (d <= end) {
    const key = formatDate(d);
    const rec = getDayRecords(key).find(r => r.id === item.id);
    if (rec && isChecked(rec)) sum += isQuantItem(item) ? rec.value : 1;
    d.setDate(d.getDate() + 1);
  }
  return sum;
}

// Daily quant values in range -> [{key, value}]
// value 为数字 = 当天有填；null = 没填（绝不能当成 0，否则体重折线会一路掉到 0）
// 默认裁掉「今天之后」的日期：还没到的日子不该出现在折线里
/* ==========================================================================
   07 · 趋势图：取值 · 刻度 · 小图绘制
   ========================================================================== */
function dailyValuesInRange(item, start, end, opts) {
  const trimFuture = !(opts && opts.trimFuture === false);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = [];
  const d = new Date(start);
  d.setHours(0, 0, 0, 0);
  while (d <= end) {
    if (trimFuture && d > today) break;
    const key = formatDate(d);
    if (item.dietMeal) {
      // 饮食三餐：数据来自 state.diets，没有对应记录就是 null
      days.push({ key, value: dietMealSumOf(key, item.dietMeal) });
    } else {
      const rec = getDayRecords(key).find(r => r.id === item.id);
      days.push({ key, value: (rec && isChecked(rec)) ? rec.value : null });
    }
    d.setDate(d.getDate() + 1);
  }
  return days;
}

// ===== 图表公共：刻度取整 + 坐标范围 =====

// 刻度步长取 1 / 2 / 2.5 / 5 × 10^k，避免左侧出现 6.85 这类难读的刻度。
// 分界点故意偏松（1.5 / 3 / 4.5 / 7），让步长尽量小，刻度跨度不会被拱大。
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const exp = Math.floor(Math.log10(raw));
  const base = Math.pow(10, exp);
  const f = raw / base;
  const m = f < 1.5 ? 1 : (f < 3 ? 2 : (f < 4.5 ? 2.5 : (f < 7 ? 5 : 10)));
  return m * base;
}

// 步长按 1 → 2 → 2.5 → 5 → 10 往上跳一档（刻度太密时用）
function bumpStep(step) {
  const exp = Math.floor(Math.log10(step));
  const base = Math.pow(10, exp);
  const m = Math.round((step / base) * 100) / 100;
  if (m < 1.5) return 2 * base;
  if (m < 2.25) return 2.5 * base;
  if (m < 3.5) return 5 * base;
  if (m < 7.5) return 10 * base;
  return 20 * base;
}

// 刻度数字：小数位由步长决定（步长 0.05 显示两位，步长 5 不带小数）
function fmtTick(v, step) {
  const dec = (String(Number(step.toFixed(6))).split('.')[1] || '').length;
  return v.toFixed(dec);
}

// 坐标轴范围（小图/大图共用）
// 1) 贴合「有填」的数据，只有数据靠近 0 时才保留 0 基线
//    —— 否则体重 67~68 这类指标会被压成一条直线；
// 2) 目标线必须画在图里：目标离数据再远也纳入视野，宁可牺牲折线的起伏，
//    也不允许出现「只有文字标注、没有虚线」的图；
// 3) 目标就是视野上下界时，往达标那一侧留 12% 余量，
//    既让「达标区」看得见，也让虚线不会贴在边框上被当成坐标框；
// 4) 上下界对齐到刻度步长，左侧标签只会是整数或一两位小数。
function chartRange(values, target, opts) {
  opts = opts || {};
  const tickCount = opts.ticks || 4;
  const goodAbove = opts.goodAbove !== false;

  const nums = (values || [])
    .filter(v => v !== null && v !== undefined && v !== '')
    .map(Number)
    .filter(v => isFinite(v));
  const t = Number(target);
  const hasT = target !== null && target !== undefined && target !== '' && isFinite(t);

  let lo, hi;
  if (nums.length) {
    lo = Math.min.apply(null, nums);
    hi = Math.max.apply(null, nums);
  } else if (hasT) {
    lo = t; hi = t;
  } else {
    lo = 0; hi = 1;
  }
  const dataMin = nums.length ? lo : null;

  // 只有一个值 / 所有值都相同：以它为中心开一个小窗口，否则没有图可画
  const flat = (hi - lo) === 0;
  const nominal = flat ? Math.max(Math.abs(hi) * 0.2, 1) : (hi - lo);
  if (flat) { lo -= nominal / 2; hi += nominal / 2; }

  // 数据贴近 0 时保留 0 基线（喝水、次数这类从 0 起量更直观）
  if (lo > 0 && lo <= nominal * 0.5) lo = 0;
  if (hi < 0 && -hi <= nominal * 0.5) hi = 0;

  // 目标线一定画出来：无论目标离数据多远，都把它纳入视野，绝不用文字替代虚线
  let targetInView = false, offHigh = false, offLow = false;
  if (hasT) {
    if (t > hi) hi = t;
    else if (t < lo) lo = t;
    targetInView = true;
  }

  // 目标贴在边缘时，往达标侧留 12% 余量，让「达标区」看得见
  if (targetInView) {
    const spanN = (hi - lo) || nominal;
    const bandPad = spanN * 0.12;
    if (goodAbove && t + bandPad > hi) hi = t + bandPad;
    if (!goodAbove && t - bandPad < lo) lo = t - bandPad;
  }

  // 数据本身非负时，别在 0 下面凭空造出一段负刻度
  if (dataMin !== null && dataMin >= 0 && lo < 0 && -lo <= (hi - lo) * 0.05) lo = 0;

  // 步长从小往大试，取「刻度不超过 7 个」的最小步长：
  // 步子太碎会出现 0.25、7.75 这种密集又难读的刻度
  let step = niceStep((hi - lo) / tickCount);
  let min = 0, max = 1, ticks = [];
  for (let guard = 0; guard < 8; guard++) {
    const dec = (String(Number(step.toFixed(6))).split('.')[1] || '').length;
    const rnd = v => Number(v.toFixed(dec + 3));
    min = rnd(Math.floor(lo / step + 1e-9) * step);
    max = rnd(Math.ceil(hi / step - 1e-9) * step);
    if (!(max > min)) max = rnd(min + step);
    const n = Math.round((max - min) / step);
    ticks = [];
    for (let k = 0; k <= n; k++) ticks.push(rnd(min + k * step));
    if (ticks.length <= 7) break;
    step = bumpStep(step);
  }

  // 目标线正好压在上/下边界上时（lte 目标高于所有数据很常见），
  // 补一格让虚线落在图内，否则它看着就像边框
  if (targetInView && ticks.length) {
    const eps = step / 1000;
    if (Math.abs(max - t) < eps) {
      max = Number((max + step).toFixed(6));
      ticks.push(max);
    } else if (Math.abs(t - min) < eps) {
      min = Number((min - step).toFixed(6));
      ticks.unshift(min);
    }
  }

  return { min, max, step, ticks, targetInView, offHigh, offLow };
}

// 达标区阴影：gte 达标区在目标线以上，lte 在以下 —— 一眼看出哪一侧更好
function goodZoneRect(target, minV, maxV, goodAbove, y) {
  const zLo = goodAbove ? Math.max(Number(target), minV) : minV;
  const zHi = goodAbove ? maxV : Math.min(Number(target), maxV);
  if (!(zHi > zLo)) return null;
  const zt = y(zHi), zb = y(zLo);
  return { top: zt, height: zb - zt };
}

// SVG line chart (no external deps); supports negative values and compare direction
// 折线图：统计页行内小图与趋势弹窗大图共用一套绘制。
// 二者算法与配色完全一致，差异只在尺寸、装饰（网格 / 刻度 / 日期轴）和文案措辞。
function renderTrendSvg(item, days, opts) {
  const big = !!(opts && opts.large);
  const W = big ? 620 : 300, H = big ? 260 : 64;
  const padL = big ? 54 : 30, padB = big ? 32 : 14, padT = big ? 22 : 8, padR = big ? 16 : 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const target = item.quant.target;
  const cmp = (item.quant && item.quant.compare) || 'gte';
  const goodAbove = cmp !== 'lte';   // gte：目标线以上算达标；lte：以下算达标
  const n = days.length;
  // 只画「有填」的点，没填的日子直接跳过（跨过去连直线，不补 0）
  const filled = days.map((d, i) => ({ i: i, v: d.value })).filter(p => p.v != null);
  // 一条记录都没有、又没有目标值时确实无图可画；只要设了目标，图照样画出来
  const hasTargetVal = target !== null && target !== undefined && target !== '' && isFinite(Number(target));
  if (n === 0 || (filled.length === 0 && !hasTargetVal)) {
    return `<div class="trend-empty${big ? ' trend-empty-lg' : ''}">本区间暂无记录</div>`;
  }

  const rng = chartRange(filled.map(p => p.v), target, { ticks: 4, goodAbove });
  const minV = rng.min, maxV = rng.max;
  const range = (maxV - minV) || 1;
  const x = i => padL + (n <= 1 ? plotW / 2 : i * plotW / (n - 1));
  const y = v => padT + plotH - ((v - minV) / range) * plotH;

  // 左侧刻度（仅大图）：步长已取整到 1/2/2.5/5×10^k，标签不会是 6.85 这类长小数
  let grid = '';
  if (big) {
    rng.ticks.forEach(v => {
      const gy = y(v).toFixed(1);
      const zero = Math.abs(v) < 1e-9;
      grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="${zero ? '#d1d5db' : '#e5e7eb'}" stroke-width="${zero ? 0.9 : 0.5}"/>`;
      grid += `<text x="${padL - 8}" y="${gy}" text-anchor="end" dominant-baseline="central" font-size="10" fill="#9ca3af">${fmtTick(v, rng.step)}</text>`;
    });
  }

  // 达标区：gte 在目标线以上、lte 在以下，淡绿一层，方向区别一眼可见
  const zoneRect = hasTargetVal ? goodZoneRect(target, minV, maxV, goodAbove, y) : null;
  const zone = zoneRect
    ? `<rect x="${padL}" y="${zoneRect.top.toFixed(1)}" width="${plotW}" height="${zoneRect.height.toFixed(1)}" fill="#059669" opacity="${big ? 0.07 : 0.09}"/>`
    : '';

  // 目标线：设了目标就一定画出来（视野里始终包含目标，不再有「超出显示范围」的空图）
  const dirArrow = goodAbove ? '↑' : '↓';
  let targetLine = '', targetLabel = '';
  if (hasTargetVal && rng.targetInView) {
    const ty = y(Number(target)).toFixed(1);
    const tyNum = Number(ty);
    const labelY = big
      ? ((tyNum - 6) < (padT + 8) ? (tyNum + 14) : (tyNum - 6))
      : ((tyNum - 4) < (padT + 5) ? (tyNum + 9) : (tyNum - 4));
    targetLine = `<line x1="${padL}" y1="${ty}" x2="${W - padR}" y2="${ty}" stroke="#dc2626" stroke-width="${big ? 1.2 : 1}" stroke-dasharray="${big ? '5 4' : '4 3'}" opacity="${big ? 0.85 : 0.75}"/>`;
    targetLabel = big
      ? `<text x="${W - padR}" y="${labelY}" text-anchor="end" font-size="10" fill="#dc2626" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">${dirArrow} 目标 ${target} ${goodAbove ? '以上达标' : '以下达标'}</text>`
      : `<text x="${W - padR}" y="${labelY}" text-anchor="end" font-size="9" fill="#dc2626" opacity="0.9" paint-order="stroke" stroke="#fff" stroke-width="2.6" stroke-linejoin="round">目标 ${target} ${dirArrow}</text>`;
  }

  const hitFn = goodAbove ? (v => v >= target) : (v => v <= target);
  const dots = filled.map(p => {
    const dotColor = !hasTargetVal ? '#4f46e5' : (hitFn(p.v) ? '#059669' : '#d97706');
    return big
      ? `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.4" fill="${dotColor}" stroke="#fff" stroke-width="1.5"/>`
      : `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.8" fill="${dotColor}" stroke="#fff" stroke-width="1"/>`;
  }).join('');

  let path = '';
  filled.forEach((p, k) => {
    const px = x(p.i).toFixed(1), py = y(p.v).toFixed(1);
    path += (k === 0 ? `M ${px} ${py}` : ` L ${px} ${py}`);
  });

  // 日期轴（仅大图）：首 / 中 / 尾三个刻度，避免拥挤
  let xLabels = '';
  if (big) {
    const idxs = n === 1 ? [0] : [0, Math.floor((n - 1) / 2), n - 1];
    [...new Set(idxs)].forEach(idx => {
      xLabels += `<text x="${x(idx).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#9ca3af">${days[idx].key.slice(5)}</text>`;
    });
  }

  const line = `<path d="${path}" fill="none" stroke="#4f46e5" stroke-width="${big ? 2.2 : 2}" stroke-linecap="round" stroke-linejoin="round"/>`;
  // 大图把目标文字压在折线下方绘制、小图压在最后：与重构前的图层顺序保持一致
  const body = big
    ? `${zone}${grid}${targetLine}${targetLabel}${line}${dots}${xLabels}`
    : `${zone}${targetLine}${line}${dots}${targetLabel}`;

  return big
    ? `<svg class="trend-modal-svg" viewBox="0 0 ${W} ${H}" role="img">${body}</svg>`
    : `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${body}</svg>`;
}

/* ==========================================================================
   08 · 统计页渲染：汇总三卡 + 分类卡片 + 趋势图
   ========================================================================== */
function renderStats() {
  const { start, end, totalDays, label } = getPeriodRange(ui.period, ui.statsOffset);

  // 自定义区间：显示日期选择条，隐藏「上一/下一周期」（对自定义区间无意义）
  const customBox = document.getElementById('statsCustomRange');
  if (customBox) customBox.style.display = ui.period === 'custom' ? 'flex' : 'none';
  const navBox = document.querySelector('.stats-period-nav');
  if (navBox) navBox.style.display = ui.period === 'custom' ? 'none' : 'flex';
  if (ui.period === 'custom') {
    const sEl = document.getElementById('statsCustomStart');
    const eEl = document.getElementById('statsCustomEnd');
    if (sEl && !sEl.value) sEl.value = ui.customRange.start;
    if (eEl && !eEl.value) eEl.value = ui.customRange.end;
  }

  // Update period nav label (‹ range ›); badge marks current period only
  const navLabel = document.getElementById('statsPeriodLabel');
  if (navLabel) {
    const periodName = ui.period === 'week' ? '周'
      : (ui.period === 'month' ? '月' : (ui.period === 'year' ? '年' : '自定义'));
    const badge = (ui.statsOffset === 0 && ui.period !== 'custom')
      ? `<span class="nav-badge">本${periodName}</span>` : '';
    navLabel.innerHTML = badge + label;
    navLabel.title = ui.statsOffset === 0 ? `当前${periodName}，点击无变化` : `点击回到当前${periodName}`;
  }

  // 汇总三卡与打卡页同一口径：分母 = 所有「可计数 + 已启用」分类的 tracked entry
  const statsCats = state.categories.filter(c => isCatCounted(c) && isCatEnabled(c));
  const statsEntries = statsCats.reduce((all, c) => all.concat(statsEntriesFor(c)), []);
  const total = statsEntries.length;

  // Summary
  let totalCheckins = 0;
  const activeDays = new Set();
  statsEntries.forEach(e => {
    const d = new Date(start);
    while (d <= end) {
      const key = formatDate(d);
      if (e.recordedOn(key)) {
        totalCheckins++;
        activeDays.add(key);
      }
      d.setDate(d.getDate() + 1);
    }
  });

  const avgPerDay = totalCheckins / totalDays;
  const completionRate = total > 0 ? Math.round(totalCheckins / (total * totalDays) * 100) : 0;

  document.getElementById('statsSummary').innerHTML = `
    <div class="stats-summary-card">
      <div class="stats-summary-value">${totalCheckins}</div>
      <div class="stats-summary-label">总打卡次数</div>
    </div>
    <div class="stats-summary-card">
      <div class="stats-summary-value">${activeDays.size}</div>
      <div class="stats-summary-label">活跃天数</div>
    </div>
    <div class="stats-summary-card">
      <div class="stats-summary-value">${completionRate}%</div>
      <div class="stats-summary-label">完成率</div>
    </div>
  `;

  // Detailed list
  const list = document.getElementById('statsList');
  if (state.categories.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📊</div><div class="text">还没有打卡数据</div></div>`;
    return;
  }

  let html = `<div style="text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:14px;">${label} · 共${totalDays}天</div>`;

  // Color palette for bars
  const colors = ['#4f46e5', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

  const endKey = formatDate(end);
  state.categories.forEach((cat, catIdx) => {
    // 停用 / 不计统计 / 开始日期未到 → 与普通分类同一套规则，不进统计页
    if (!isCatEnabled(cat)) return;
    if (!isCatCounted(cat)) return;
    if (cat.startDate && endKey < cat.startDate) return;
    const rows = statsRowsFor(cat, start, end, totalDays, colors[catIdx % colors.length]);
    if (rows.length === 0) return;
    html += statsCardHtml(cat, rows);
  });

  list.innerHTML = html;
}

// 统计页的一行 = 一个 tracked entry 在区间内的表现。
// 普通项 / 量化项 / 饮食餐次三种行的差异全部落在字段上，标记只写一份。
function statsRowHtml(r) {
  const cls = 'stats-item-row'
    + (r.quant ? ' quant-row' : '')
    + (r.extraClass ? ' ' + r.extraClass : '')
    + (r.archived ? ' archived' : '');
  const attrs = r.onclick
    ? ` onclick="${r.onclick}" style="cursor:pointer" title="点击查看趋势大图"`
    : '';
  return `<div class="${cls}"${attrs}>
          <div class="stats-item-header">
            <span class="stats-item-name">${escapeHtml(r.name)}${r.archivedTag || ''}${r.tagHtml || ''}</span>
            <span class="stats-item-freq">
              <span class="current">${r.freqCurrent}</span><span class="total">/${r.freqSuffix}</span>
            </span>
          </div>
          <div class="stats-item-bar">
            <div class="stats-item-bar-fill" style="width:${Math.min(100, r.pct)}%; background:${r.color};"></div>
          </div>
          ${r.trend || ''}
          <div class="stats-item-meta">
            <span>${r.metaLeft}</span>
            ${r.metaRight ? `<span class="quant-sum">${r.metaRight}</span>` : ''}
            <span>🔥 连续${r.streak}天 · 累计${r.count}次</span>
          </div>
        </div>`;
}

function statsCardHtml(cat, rows) {
  return `<div class="stats-category-card${cat.archived ? ' archived' : ''}">
      <div class="category-header">
        <span class="category-name">${escapeHtml(cat.name)}${cat.archived ? ' <span class="archived-tag">已归档</span>' : ''}</span>
      </div>
      ${rows.map(statsRowHtml).join('')}
    </div>`;
}

// 哪个分类出哪些行（形态差异在 04c 的 CAT_ADAPTERS 里）
function statsRowsFor(cat, start, end, totalDays, color) {
  return adapterFor(cat).statsRows(cat, start, end, totalDays, color);
}

// 普通分类：每个打卡项一行
function itemStatsRows(cat, start, end, totalDays, color) {
  const catArchived = !!cat.archived;
  return (cat.items || []).map(item => {
    const archived = catArchived || !!item.archived;
    const archivedTag = item.archived && !catArchived ? ' <span class="archived-tag">已归档</span>' : '';
    const count = countInRange(item.id, start, end);
    const pct = totalDays > 0 ? Math.round(count / totalDays * 100) : 0;
    const streak = getStreak(item.id);
    const totalCount = getTotalCount(item.id);

    if (!isQuantItem(item)) {
      return {
        name: item.name, quant: false, archived: archived, archivedTag: archivedTag,
        tagHtml: '', freqCurrent: count, freqSuffix: `${totalDays}天`, pct: pct,
        trend: '', metaLeft: `完成率 ${pct}%`, metaRight: '',
        streak: streak, count: totalCount, color: color, onclick: null
      };
    }

    // 量化项：gte 看累积完成值 / 计划值，lte 看达标天数占比
    const isLte = (item.quant.compare || 'gte') === 'lte';
    const doneDays = countDoneInRange(item, start, end);
    const sumVal = sumValueInRange(item, start, end);
    const planVal = item.quant.target * totalDays;
    const unit = item.quant.unit;
    const daily = dailyValuesInRange(item, start, end);
    const rateVal = isLte
      ? Math.round(doneDays / totalDays * 100)
      : Math.round(sumVal / Math.max(planVal, 1) * 100);
    return {
      name: item.name, quant: true, archived: archived, archivedTag: archivedTag,
      tagHtml: `<span class="quant-target-tag">🎯 ${item.quant.target}${escapeHtml(unit)}/天</span>`,
      freqCurrent: doneDays, freqSuffix: `${totalDays}天`, pct: rateVal,
      trend: renderTrendSvg(item, daily),
      metaLeft: `${isLte ? '达标率' : '完成率'} ${rateVal}%`,
      metaRight: `${isLte ? `合计 ${sumVal}` : `总完成 ${sumVal}/${planVal}`} ${escapeHtml(unit)}`,
      streak: streak, count: totalCount, color: color,
      onclick: `openTrendModal('${item.id}')`
    };
  });
}

// 饮食：三餐 + 全天合计，都是量化行（带趋势小图，点行看大图）
function dietStatsRows(cat, start, end, totalDays, color) {
  const goals = getDietGoals();
  const list = DIET_MEALS.concat([{ key: 'total', name: '全天合计' }]);
  return list.map(m => {
    const isTotal = m.key === 'total';
    const goal = goals[isTotal ? 'total' : m.key];
    const hasGoal = goal != null && goal > 0;
    const item = dietTrendItem(m.key);
    const daily = dailyValuesInRange(item, start, end);
    const filled = daily.map(d => d.value).filter(v => v != null);
    const sum = filled.reduce((a, b) => a + b, 0);
    const avg = filled.length ? Math.round(sum / filled.length) : 0;
    // 热量是上限：不超过目标才算达标；没设目标就只看记录率
    const hitDays = hasGoal ? filled.filter(v => v <= goal).length : 0;
    const rateVal = Math.round((hasGoal ? hitDays : filled.length) / Math.max(totalDays, 1) * 100);

    return {
      name: m.name,
      quant: true,
      archived: false,
      archivedTag: '',
      tagHtml: hasGoal
        ? `<span class="quant-target-tag">🎯 ${goal}千卡/天</span>`
        : `<span class="quant-target-tag none">未设目标</span>`,
      freqCurrent: hasGoal ? hitDays : filled.length,
      freqSuffix: `${totalDays}天`,
      pct: rateVal,
      trend: renderTrendSvg(item, daily),
      metaLeft: hasGoal ? `达标率 ${rateVal}%` : `记录率 ${rateVal}%`,
      metaRight: filled.length ? `平均 ${avg} 千卡/天 · 合计 ${sum} 千卡` : '本区间暂无记录',
      streak: getDietMealStreak(m.key),
      count: getDietMealTotalCount(m.key),
      color: color,
      extraClass: 'diet-stats-row' + (isTotal ? ' total' : ''),
      onclick: `openTrendModal('${item.id}')`
    };
  });
}

function getTotalCount(itemId) {
  let count = 0;
  Object.keys(state.records).forEach(key => {
    if (getDayCheckedIds(key).includes(itemId)) count++;
  });
  return count;
}

// 一键切换正负号（解决手机端数字键盘无负号键的问题）
function toggleSign(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const v = el.value.trim();
  el.value = v.startsWith('-') ? v.slice(1) : '-' + v;
  el.focus();
}

// 输入净化：仅保留可选前导负号 + 数字 + 单个小数点（兼容逗号作小数点）
function sanitizeNumberInput(el) {
  let v = el.value;
  const neg = v.trim().startsWith('-');
  let digits = v.replace(/[^0-9.,]/g, '').replace(/,/g, '.');
  const dot = digits.indexOf('.');
  if (dot !== -1) digits = digits.slice(0, dot + 1) + digits.slice(dot + 1).replace(/\./g, '');
  el.value = (neg ? '-' : '') + digits;
}

function openEditModal(title, sub, bodyHtml, state, okLabel) {
  document.getElementById('editModalTitle').textContent = title;
  document.getElementById('editModalSub').textContent = sub || '';
  document.getElementById('editModalBody').innerHTML = bodyHtml;
  document.getElementById('editModalOk').textContent = okLabel || '确定';
  ui.modal = state;
  document.getElementById('editModal').classList.add('show');
  const first = document.querySelector('#editModalBody input');
  if (first) setTimeout(() => first.focus(), 50);
}

function closeEditModal() {
  const modal = document.getElementById('editModal');
  modal.classList.remove('show');
  modal.classList.remove('diet-modal');
  ui.modal = null;
}

function toggleQuantFields() {
  const on = document.getElementById('modalQuantOn').checked;
  document.getElementById('quantFields').style.display = on ? 'block' : 'none';
}

function confirmEditModal() {
  const s = ui.modal;
  if (!s) return;
  if (s.type === 'editCat') {
    const v = document.getElementById('modalInput1').value.trim();
    if (!v) { showToast('请输入名称'); return; }
    const cat = state.categories.find(c => c.id === s.catId);
    if (cat) {
      cat.name = v;
      commit();
      showToast('分类名称已修改');
    }
  } else if (s.type === 'editItem') {
    const v = document.getElementById('modalInput1').value.trim();
    if (!v) { showToast('请输入名称'); return; }
      const cat = state.categories.find(c => c.id === s.catId);
      const item = cat && cat.items.find(i => i.id === s.itemId);
      if (item) {
        item.name = v;
        const quantOn = document.getElementById('modalQuantOn').checked;
        if (quantOn) {
          const unit = document.getElementById('modalUnit').value.trim();
          const target = parseFloat(document.getElementById('modalTarget').value.replace(',', '.'));
          const compare = document.getElementById('modalCompare').value || 'gte';
          if (!unit) { showToast('请输入量化单位'); return; }
          if (isNaN(target)) { showToast('请输入有效的目标数值'); return; }
          item.quant = { unit: unit, target: target, compare: compare };
        } else {
          delete item.quant;
        }
        commit();
        showToast('打卡项已修改');
      }
  } else if (s.type === 'editFood') {
    const f = getFoods().find(x => x.id === s.id);
    if (!f) return;
    const kind = (document.getElementById('modalFoodKind') || {}).value || 'food';
    const brand = ((document.getElementById('modalFoodBrand') || {}).value || '').trim();
    const name = ((document.getElementById('modalFoodName') || {}).value || '').trim();
    const kcalRaw = ((document.getElementById('modalFoodKcal') || {}).value || '').replace(/[^0-9.]/g, '');
    const kcal = parseFloat(kcalRaw);
    if (!brand) { showToast('请填写品牌'); return; }
    if (!name) { showToast('请填写食物名称'); return; }
    if (!kcalRaw || isNaN(kcal) || kcal < 0) { showToast('请填写正确的热量数值'); return; }
    f.kind = kind; f.brand = brand; f.name = name; f.kcal = Math.round(kcal);
    syncDietFoodSnapshots(f);
    commit();
    showToast('已保存');
  } else if (s.type === 'dietGoals') {
    const next = {};
    for (const m of DIET_MEALS) {
      const el = document.getElementById('dietGoalInput_' + m.key);
      const typed = ((el && el.value) || '').trim();
      const raw = typed.replace(/[^0-9.]/g, '');
      if (typed === '') { next[m.key] = null; continue; }   // 留空 = 该餐不设目标
      const n = parseFloat(raw);
      if (raw === '' || isNaN(n) || n <= 0) { showToast(`${m.name}目标请填大于 0 的数字`); return; }
      next[m.key] = Math.round(n);
    }
    // 全天总目标单独校验：与三餐互不联动
    const tEl = document.getElementById('dietGoalInput_total');
    const tTyped = ((tEl && tEl.value) || '').trim();
    const tRaw = tTyped.replace(/[^0-9.]/g, '');
    if (tTyped === '') {
      next.total = null;
    } else {
      const tn = parseFloat(tRaw);
      if (tRaw === '' || isNaN(tn) || tn <= 0) { showToast('全天总目标请填大于 0 的数字'); return; }
      next.total = Math.round(tn);
    }
    state.dietGoals = next;
    commit();
    closeEditModal();
    showToast('饮食目标已保存');
  } else if (s.type === 'dietMeal') {
    closeEditModal();
    return;
  } else if (s.type === 'addFood') {
    if (!addFood()) return;   // 校验失败时保持弹窗打开
    closeEditModal();
    return;
  } else if (s.type === 'quantExport') {
    const sv = ((document.getElementById('expStart') || {}).value || '').trim();
    const ev = ((document.getElementById('expEnd') || {}).value || '').trim();
    if (!sv || !ev) { showToast('请选择开始和结束日期'); return; }
    const d1 = new Date(sv + 'T00:00:00');
    const d2 = new Date(ev + 'T00:00:00');
    if (isNaN(d1.getTime()) || isNaN(d2.getTime())) { showToast('日期无效'); return; }
    if (d1 > d2) { showToast('开始日期不能晚于结束日期'); return; }
    const ids = Array.prototype.slice.call(document.querySelectorAll('.exp-item:checked')).map(el => el.value);
    if (ids.length === 0) { showToast('请至少选择一个指标'); return; }
    exportQuantCsv(d1, d2, ids);
  } else if (s.type === 'trendView') {
    closeEditModal();
    return;
  } else if (s.type === 'quantInput') {
    const input = document.getElementById('modalQuantValue');
    const raw = input.value.trim();
    const num = raw === '' ? 0 : parseFloat(raw.replace(',', '.'));
    if (isNaN(num)) { showToast('请输入有效数值'); return; }
    setQuantValue(s.itemId, num);
    showToast(num !== 0 ? '已记录' : '已取消打卡');
  } else if (s.type === 'note') {
    const note = document.getElementById('modalNote').value;
    setNote(s.itemId, note);
    showToast(note.trim() ? '备注已保存' : '备注已清除');
  } else if (s.type === 'dietNote') {
    const note = document.getElementById('modalNote').value;
    setDietMealNote(formatDate(ui.date), s.mealKey, note);
    showToast(note.trim() ? '备注已保存' : '备注已清除');
  } else if (s.type === 'setStartDate') {
    const date = document.getElementById('modalStartDate').value;
    const cat = state.categories.find(c => c.id === s.catId);
    if (cat) {
      cat.startDate = date || undefined;
      commit();
      showToast(date ? `开始日期设为 ${date}` : '已清除开始日期（立即生效）');
    }
  }
  closeEditModal();
}

function renderManage() {
  // Category list
  const list = document.getElementById('manageList');
  if (state.categories.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📁</div><div class="text">还没有分类</div></div>`;
    return;
  }

  const activeCats = state.categories.filter(c => !c.archived);
  const archivedCats = state.categories.filter(c => c.archived);
  let html = '';

  // Active categories
  activeCats.forEach(cat => { html += manageCategoryHtml(cat); });

  // Archived categories
  if (archivedCats.length > 0) {
    html += `<div class="archived-categories">
      <div class="archived-categories-title">📦 已归档分类</div>`;
    archivedCats.forEach(cat => {
      html += `<div class="manage-category archived">
        <div class="manage-category-header">
          <span class="name">${escapeHtml(cat.name)} <span class="archived-tag">已归档</span></span>
          <button class="btn btn-success" onclick="restoreCategory('${cat.id}')">恢复</button>
          <button class="btn btn-danger" onclick="permanentDeleteCategory('${cat.id}')">彻底删除</button>
        </div>`;
      (cat.items || []).forEach(item => {
        html += `<div class="manage-item-row archived">
          <span class="name">${escapeHtml(item.name)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  list.innerHTML = html;
}

function moveCategory(catId, direction) {
  const idx = state.categories.findIndex(c => c.id === catId);
  if (idx < 0) return;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= state.categories.length) {
    showToast(direction < 0 ? '已经在最上面' : '已经在最下面');
    return;
  }
  const [moved] = state.categories.splice(idx, 1);
  state.categories.splice(newIdx, 0, moved);
  commit();
  showToast(direction < 0 ? '已上移' : '已下移');
}

function archiveCategory(catId) {

function restoreCategory(catId) {

    cat.archived = false;
    commit();
    showToast('分类已恢复');
  }
}

function permanentDeleteCategory(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  const isDiet = isDietCat(cat);
  const extra = isDiet ? '\n\n⚠️ 该分类的饮食记录（食物明细、三餐目标、备注）也会一并清空。' : '';
  if (!confirm(`确定彻底删除「${cat.name}」及其所有打卡项吗？\n\n⚠️ 此操作不可恢复，所有历史打卡记录将永久丢失！${extra}`)) return;
  if (!confirm('再次确认：真的要永久删除吗？')) return;
  // Collect all item IDs
  const itemIds = (cat.items || []).map(i => i.id);
  state.categories = state.categories.filter(c => c.id !== catId);
  // Clean up records (supports both string and {id,value} entries)
  Object.keys(state.records).forEach(date => {
    state.records[date] = state.records[date].filter(r => !itemIds.includes(getRecordObj(r).id));
    if (state.records[date].length === 0) delete state.records[date];
  });
  if (isDiet) {
    // 与普通分类一致：彻底删除 = 数据一并清空，并记住「别再把内置分类建回来」
    state.diets = {};
    state.dietMealNotes = {};
    state.dietGoals = Object.assign({}, DIET_GOAL_DEFAULT);
    state.dietRemoved = true;
  }
  commit();
  showToast('分类已彻底删除');
}

function restoreItem(catId, itemId) {

    if (item) {

function foodKindLabel(kind) {
  return kind === 'drink' ? '🥤 饮品' : '🍱 食物';
}

function getFoods() {
  if (!Array.isArray(state.foods)) state.foods = [];
  return state.foods;
}

// 品牌下拉：已有品牌可直接选 +「＋ 新建品牌」
function renderFoodBrandOptions() {
  const sel = document.getElementById('foodBrandSelect');
  if (!sel) return;
  const prev = sel.value;
  const brands = [...new Set(getFoods().map(f => (f.brand || '').trim()).filter(Boolean))];
  brands.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
  sel.innerHTML = brands.map(b => `<option value="${escAttr(b)}">${escapeHtml(b)}</option>`).join('')
    + `<option value="__new__">＋ 新建品牌…</option>`;
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  // 仅同步“新建品牌”输入框的显隐，不抢焦点（避免每次重渲染跳焦点）
  const box = document.getElementById('foodBrandNew');
  if (box) box.style.display = (sel.value === '__new__') ? 'block' : 'none';
}

function onFoodBrandChange() {
  const sel = document.getElementById('foodBrandSelect');
  const box = document.getElementById('foodBrandNew');
  if (!sel || !box) return;
  const isNew = sel.value === '__new__';
  box.style.display = isNew ? 'block' : 'none';
  if (isNew) box.focus();
}

function setFoodFilter(kind) {
  ui.foodFilter = kind;
  document.querySelectorAll('.food-filter-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-food-filter') === kind);
  });
  renderFoods();
}

function renderFoods() {
  const listEl = document.getElementById('foodList');
  if (!listEl) return;
  renderFoodBrandOptions();

  const kw = ((document.getElementById('foodSearch') || {}).value || '').trim().toLowerCase();
  let foods = getFoods().slice();
  if (ui.foodFilter !== 'all') foods = foods.filter(f => (f.kind || 'food') === ui.foodFilter);
  if (kw) {
    foods = foods.filter(f =>
      (f.brand || '').toLowerCase().includes(kw) || (f.name || '').toLowerCase().includes(kw));
  }

  if (foods.length === 0) {
    listEl.innerHTML = `<div class="food-empty">${getFoods().length === 0 ? '还没有食物记录，点上方「＋ 新增记录」添加第一条' : '没有匹配的结果'}</div>`;
    return;
  }

  // 先按分类分组（饮品 / 食物），组内再按品牌合并成块
  let html = '';
  ['drink', 'food'].forEach(kind => {
    const inKind = foods.filter(f => (f.kind || 'food') === kind);
    if (inKind.length === 0) return;
    html += `<div class="manage-section-title" style="margin:14px 0 8px;">${foodKindLabel(kind)}</div>`;
    const brands = [...new Set(inKind.map(f => (f.brand || '').trim()))].filter(Boolean);
    brands.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
    brands.forEach(brand => {
      const rows = inKind.filter(f => (f.brand || '').trim() === brand);
      html += `<div class="food-brand-card">
        <div class="food-brand-head">
          <span>${escapeHtml(brand)}</span>
          <span class="food-brand-count">${rows.length} 项</span>
        </div>
        ${rows.map(f => `<div class="food-row">
          <span class="food-row-name">${escapeHtml(f.name)}</span>
          <span class="food-row-kcal">${f.kcal} 千卡</span>
          <button class="btn-icon" onclick="editFood('${f.id}')" title="编辑">✏️</button>
          <button class="btn-icon" onclick="deleteFood('${f.id}')" title="删除">🗑️</button>
        </div>`).join('')}
      </div>`;
    });
  });
  listEl.innerHTML = html;
}

function addFood() {
  const kindEl = document.getElementById('foodKind');
  const sel = document.getElementById('foodBrandSelect');
  const kind = (kindEl && kindEl.value) || 'food';
  const isNew = sel && sel.value === '__new__';

  const nameEl = document.getElementById('foodName');

  const name = ((nameEl && nameEl.value) || '').trim();
  const kcalRaw = ((kcalEl && kcalEl.value) || '').replace(/[^0-9.]/g, '');

  getFoods().push({ id: genId('food'), kind: kind, brand: brand, name: name, kcal: Math.round(kcal) });
