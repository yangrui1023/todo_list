.cloud-status-badge.enabled {
  background: var(--success-light);
  color: var(--success);
}
.cloud-status-badge.disabled {
  background: var(--bg);
  color: var(--text-muted);
}
.cloud-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.cloud-form input {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.cloud-form input:focus { border-color: var(--primary); }
.cloud-form .btn { align-self: flex-start; }
.cloud-instructions {
  margin-top: 14px;
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-secondary);
}
.cloud-instructions ol { padding-left: 20px; }
.cloud-instructions a { color: var(--primary); }
.cloud-instructions code {
  background: var(--card-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  border: 1px solid var(--border);
  display: inline-block;
  margin: 2px 0;
}
.cloud-sql-block {
  background: #1e1e2e;
  color: #cdd6f4;
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  margin: 8px 0;
  overflow-x: auto;
  white-space: pre;
  line-height: 1.5;
}

/* QR Code Modal */
.qr-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
.qr-modal-overlay.show { display: flex; }
.qr-modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 28px;
  max-width: 320px;
  width: 90%;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.qr-modal h3 { font-size: 16px; margin-bottom: 6px; }
.qr-modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
.qr-modal img { width: 220px; height: 220px; border-radius: var(--radius-sm); margin-bottom: 12px; }
.qr-modal .qr-link {
  font-size: 11px;
  color: var(--text-muted);
  word-break: break-all;
  background: var(--bg);
  padding: 8px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
  max-height: 60px;
  overflow-y: auto;
}
.qr-modal .btn { margin: 0 4px; }

/* ===== Generic Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9998;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px;
  width: 90%;
  max-width: 340px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  max-height: 85vh;
  overflow-y: auto;
}
.modal h3 { font-size: 16px; margin-bottom: 4px; }
.modal .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.modal label {
  display: block;
  font-size: 13px;
  color: var(--text-muted);
  margin: 12px 0 4px;
}
.modal-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  outline: none;
  box-sizing: border-box;
}
.modal-input:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal-actions .btn { margin: 0; }
.quant-toggle-row {
  margin-top: 14px;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
}
.quant-toggle-row input { margin-right: 6px; }
.quant-input-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.quant-input-row .modal-input { flex: 1; }
.quant-unit { font-size: 14px; color: var(--text-muted); white-space: nowrap; }
.quant-input-hint { font-size: 13px; color: var(--text-secondary); margin: 8px 0 2px; }
.quant-input-tip { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.num-input-wrap { display: flex; align-items: center; gap: 8px; }
.num-input-wrap .modal-input { flex: 1; }
.sign-toggle {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 20px; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
  transition: background .12s, color .12s;
}
.sign-toggle:active { background: var(--primary); color: #fff; }

/* ===== Quant badge (checkin page) ===== */
.note-btn {
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 6px;
  opacity: 0.45;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.note-btn:hover { opacity: 1; background: var(--bg); }
.note-btn.has { opacity: 1; }
.note-textarea { resize: vertical; font-family: inherit; min-height: 64px; }
.nocount-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--warning-light);
  color: var(--warning);
  margin-left: 4px;
  vertical-align: middle;
  font-weight: 500;
}
.startdate-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--primary-light);
  color: var(--primary);
  margin-left: 4px;
  vertical-align: middle;
  font-weight: 500;
}
.btn-active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

/* Toggle switch with label (countInStats) */
.switch-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.2s;
  white-space: nowrap;
}
.switch-pill:hover { border-color: var(--primary); }
.switch-pill.on {
  color: var(--success);
  border-color: var(--success);
  background: var(--success-light);
}
.switch-pill.off .switch-label { color: var(--text-muted); }
.switch-track {
  position: relative;
  width: 24px;
  height: 14px;
  border-radius: 14px;
  background: var(--border);
  transition: background 0.2s;
  flex-shrink: 0;
}
.switch-track.on { background: var(--success); }
.switch-knob {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  top: 2px;
  left: 2px;
  transition: transform 0.2s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.25);
}
.switch-track.on .switch-knob { transform: translateX(10px); }

/* Add-category: 纳入统计 checkbox */
.add-cat-check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  cursor: pointer;
  user-select: none;
}
.add-cat-check input {
  width: 16px;
  height: 16px;
  accent-color: var(--success);
  cursor: pointer;
}
.checkin-item .quant-badge {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--bg);
  color: var(--text-muted);
  white-space: nowrap;
}
.checkin-item .quant-badge.ok { background: var(--success-light); color: var(--success); }
.checkin-item .quant-badge.low { background: var(--warning-light); color: var(--warning); }
.checkin-item.partial .checkin-checkbox {
  border-color: var(--warning);
  background: var(--warning-light);
}

/* ===== Quant stats (unified with plain item rows) ===== */
.quant-target-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  color: var(--primary);
  background: var(--primary-light);
  padding: 1px 8px;
  border-radius: 8px;
  margin-left: 6px;
  vertical-align: middle;
}
.quant-row .trend-svg { margin-top: 8px; }
.quant-row .stats-item-meta { margin-top: 6px; }
.trend-svg { display: block; margin-top: 10px; }

/* ===== Calendar ===== */
.calendar-wrap {
  margin: 12px 0;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.calendar-header .cal-month { font-size: 14px; font-weight: 600; }
.cal-nav-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-muted);
  padding: 2px 10px;
  border-radius: 6px;
}
.cal-nav-btn:hover { background: var(--bg); color: var(--text); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-weekday {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 0;
}
.cal-day {
  position: relative;
  text-align: center;
  padding: 6px 0 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
}
.cal-day:hover { background: var(--bg); }
.cal-day.today { font-weight: 700; color: var(--primary); }
.cal-day.selected { background: var(--primary); color: #fff; font-weight: 600; }
.cal-day.other { color: var(--text-muted); opacity: 0.4; }
.cal-day .cal-count {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  line-height: 1;
  background: var(--success-light);
  color: var(--success);
  border-radius: 8px;
  padding: 2px 4px;
  min-width: 16px;
  font-weight: 600;
}
.cal-day .cal-count.zero { display: none; }
.cal-day.selected .cal-count { background: rgba(255,255,255,0.3); color: #fff; }

/* ===== Manage edit buttons ===== */
.btn-icon { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: 6px; color: var(--text-muted); transition: background 0.2s; }
.btn-icon:hover { background: var(--bg); color: var(--text); }
.manage-item-row .btn-icon { margin-right: 4px; }
.btn-sm { font-size: 12px; padding: 3px 10px; }
/* Unify category-header action buttons: 纳入统计 / 编辑 / 归档 / 删除 */
.manage-category-header .manage-btn-group .btn,
.manage-category-header .manage-btn-group .switch-pill {
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 8px;
}
.quant-mini {
  display: inline-block;
  font-size: 11px;
  color: var(--warning);
  background: var(--warning-light);
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: 6px;
  vertical-align: middle;
}

/* ===== Auth Gate ===== */
.auth-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.auth-overlay.hidden { display: none; }
.auth-card {
  background: white;
  border-radius: 20px;
  padding: 40px 32px;
  width: 90%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: authFadeIn 0.4s ease;
}
@keyframes authFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-icon { font-size: 48px; margin-bottom: 12px; }
.auth-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.auth-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
.auth-input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  outline: none;
  text-align: center;
  transition: border-color 0.2s;
  margin-bottom: 10px;
}
.auth-input:focus { border-color: var(--primary); }
.auth-btn {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.auth-btn:hover { background: var(--primary-dark); }
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-error {
  margin-top: 12px;
  font-size: 13px;
  color: var(--danger);
  min-height: 18px;
}
.auth-toggle {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-muted);
}
.auth-toggle a {
  color: var(--primary);
  cursor: pointer;
  text-decoration: none;
  font-weight: 600;
}
.auth-toggle a:hover { text-decoration: underline; }

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .text { font-size: 15px; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 200;
  transition: transform 0.3s ease;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== Food (calorie) tab ===== */
.food-add-bar { margin-bottom: 12px; }
.food-add-btn { width: 100%; }
.trend-empty {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  padding: 14px 0;
}
.trend-empty-lg { font-size: 13px; padding: 42px 0; }
.food-search {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  margin-bottom: 12px;
  background: var(--card-bg);
  color: var(--text);
  box-sizing: border-box;
}
.food-search:focus { border-color: var(--primary); }
.food-filter { display: flex; gap: 8px; margin-bottom: 12px; }
.food-filter-btn {
  flex: 1;
  padding: 8px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.food-filter-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.food-brand-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  overflow: hidden;
}
.food-brand-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.food-brand-count { font-size: 12px; color: var(--text-muted); font-weight: 400; white-space: nowrap; }
.food-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}
.food-row-name {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.food-row-kcal { font-size: 14px; font-weight: 600; color: var(--primary); white-space: nowrap; }
.food-kind-tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 8px;
  white-space: nowrap;
  background: var(--bg);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.food-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }

/* ===== 打卡页 · 饮食记录（复用普通分类卡片，不自造一套）===== */
/* 热量总量做成分类名旁的小标签，位置与普通打卡项的 🎯 目标标签一致 */
.quant-mini.diet-kcal { font-variant-numeric: tabular-nums; }
.quant-mini.diet-kcal.over { background: var(--warning-light); color: var(--warning); }
/* 餐次行勾选后不划线——它是「这一餐记完了」，不是待办的划掉 */
.checkin-item.diet-meal-item.checked .checkin-item-name { color: var(--text); text-decoration: none; }
.checkin-item.diet-meal-item .quant-badge { font-variant-numeric: tabular-nums; }

/* 记账弹窗：增删改都是即时生效，不存在「取消」，只保留一个「完成」 */
#editModal.diet-modal .modal-actions .btn-outline { display: none; }
#editModal.diet-modal .modal-actions .btn-primary { flex: 1; }

/* 记账弹窗 */
.diet-modal-list { max-height: 40vh; overflow-y: auto; }
.diet-modal-list .diet-row:first-child { border-top: none; }
.diet-modal-add {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border: 1px dashed var(--primary);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--primary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.diet-modal-add:active { background: var(--primary-light); }
.diet-modal-sum {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.diet-modal-sum-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.diet-modal-sum-label { font-size: 12px; color: var(--text-muted); }
.diet-modal-sum-val {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.diet-modal-sum-val .unit { font-size: 12px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }
.diet-modal-sum-rest { font-size: 12px; color: var(--text-muted); }
.diet-modal-sum-rest.ok { color: var(--success); }
.diet-modal-sum-rest.over { color: var(--warning); }
.diet-modal-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--bg);
  overflow: hidden;
  margin-top: 8px;
}
.diet-modal-bar i {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: var(--success);
  transition: width 0.25s;
}
.diet-modal-bar i.over { background: var(--warning); }
.diet-goal-divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0 4px;
}
.diet-goal-tip {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-muted);
}

/* 分类管理：饮食目标摘要行 + 停用态 */
/* 饮食目标行：沿用 .manage-item-row，右侧箭头代替 ⋮，整行点开目标设置 */
.diet-goal-row { cursor: pointer; }
.diet-goal-row:active { background: var(--bg); }
.diet-goal-row .diet-goal-arrow {
  flex: 0 0 auto;
  padding: 6px 8px;          /* 与普通行的 ⋮ 同尺寸，右侧留白对齐 */
  color: var(--text-muted);
  font-size: 17px;
  line-height: 1;
}
.diet-goal-row.total .name { font-weight: 600; }
.diet-goal-none { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
.quant-mini.total { color: var(--primary); background: var(--primary-light); }
/* 统计页饮食行：未设目标灰标签；全天合计行与三餐区分开 */
.quant-target-tag.none { color: var(--text-muted); background: var(--bg); }
.diet-stats-row.total { border-top: 1px dashed var(--border); }
.diet-stats-row.total .stats-item-name { font-weight: 600; }
.manage-category.disabled { opacity: 0.6; }
.disabled-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 8px;
  background: var(--border);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 400;
  vertical-align: middle;
}

/* 明细行 / 份数控件 / 食物库选择（打卡页与弹窗共用） */
.diet-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--border);
}
.diet-row-main { flex: 1; min-width: 0; }
.diet-row-name {
  display: block;
  font-size: 14px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.diet-row-brand { font-size: 11px; color: var(--text-muted); margin-left: 4px; font-weight: 400; }
.diet-qty { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.diet-qty-btn {
  width: 26px; height: 26px;
  border: 1px solid var(--border);

<script data-page-node-id="PqHExR5XTp3gCDBHWbN5Pi" data-pnid-children="hmPndJtjq4HWNksaQ2OLG9">
// ============================================================================
// 每日打卡 · 单文件应用（无构建、无依赖，直接部署到 GitHub Pages）
//
// 命名约定：
//   render* / draw*   只读渲染，不写 state
//   open* / close*    开 / 关弹窗，写 ui.modal 与 ui.diet.*
//   toggle* / add* / remove* / move* / archive* / restore* / set*
//                     写操作：只改 state，末尾调 commit()，不自己调 render*
//   get* / is* / fmt* 纯函数，无副作用
//
// 渲染约定（第三层）：
//   写操作只调 commit()，重画什么由 04b 的调度器决定 —— 整块重画当前 tab 的全部容器。
//   所以不存在「漏刷某块」：新增一块同屏界面，只要把容器加进 TAB_RENDERERS 就够了。
//   只在一种情况下直接调 render*：初始化（initApp）与纯界面导航（切日期 / 切 tab）。
//
// 分类形态约定（第四层）：
//   「内置分类」和「普通分类」的差别只允许出现在 04c 的适配器里。

//   sync    登录会话与同步节奏（含冲突快照 sync.conflict）

// 转义约定（第四层后的安全收口）：
//   文本节点用 escapeHtml，属性值用 escAttr —— 浏览器不会替文本节点转义引号，
//   value="${escapeHtml(x)}" 等于把属性留给用户输入来截断。除此之外还有两条防线：
//   入口 id 白名单（sanitizeState）与 CSV 文本列前缀（csvTextCell）。

// ===== 数据结构版本与迁移 =====
// 加字段的正确姿势（三段式，别只改其中一处）：
//   ① makeEmptyState() 里补默认值 —— 新装用户直接拿到完整结构
//   ② 在 MIGRATIONS 里追加一条 { to: N+1, up(s) }，只写「从 N 到 N+1 的差异」
//   ③ SCHEMA_VERSION 加一
// 老数据（本地缓存 / 云端旧记录 / 别人发来的 JSON 备份）进来时，会从它自己的版本
// 一路跑到最新，跑完再统一过一遍 normalize + sanitize。
const SCHEMA_VERSION = 2;

function makeEmptyState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    categories: [],
    records: {},        // { "2026-08-10": [{ id, value?, note? }] }
    foods: [],          // [{ id, kind: 'drink'|'food', brand, name, kcal }]
    diets: {},          // { "2026-08-10": [{ id, meal, foodId, name, brand, kcal, qty }] }
    dietGoals: Object.assign({}, DIET_GOAL_DEFAULT),
    dietMealNotes: {},  // { "2026-08-10": { breakfast: "备注" } }
    dietRemoved: false, // 用户彻底删掉饮食分类后置 true，避免又被建回来
    _rev: 0,            // 数据版本号，同步时用来判断「谁改过」
    _updated_at: ''
  };
}

// 全站唯一的业务状态。真实数据由 loadData() 从本地缓存接管；
// 这里的初值只是为了在 loadData 之前访问 state 也不至于崩。
let state = makeEmptyState();

// 迁移表：每一项只负责「上一版 → 这一版」的差异，按 to 升序执行。
// 没有 schemaVersion 的老数据一律视为第 1 版。
const MIGRATIONS = [
  {
    to: 2,
    up(s) {
      // v1 时代没有食物库 / 饮食明细 / 餐次备注
      if (!Array.isArray(s.foods)) s.foods = [];
      if (!s.diets || typeof s.diets !== 'object') s.diets = {};
      if (!s.dietMealNotes || typeof s.dietMealNotes !== 'object') s.dietMealNotes = {};
      if (!s.dietGoals || typeof s.dietGoals !== 'object') s.dietGoals = {};
      if (typeof s.dietRemoved !== 'boolean') s.dietRemoved = false;
      // 缺哪一餐的目标就补默认值（用户显式设成 null 的保持 null）
      s.dietGoals = Object.assign({}, DIET_GOAL_DEFAULT, s.dietGoals);
      // 更早的饮食记录没有 meal 字段：默认归午餐，别让历史数据凭空消失
      Object.keys(s.diets).forEach(k => {
        const arr = s.diets[k];
        if (!Array.isArray(arr)) { s.diets[k] = []; return; }
        arr.forEach(e => {
          if (e && DIET_MEAL_KEYS.indexOf(e.meal) < 0) e.meal = 'lunch';
        });
      });
    }
  }
];

// 兜底整形：不管数据自称第几版，跑完都要满足这些前提。
// 这里只保证「能用、不崩」，不负责语义迁移。
function normalizeState(s) {
  if (!Array.isArray(s.categories)) s.categories = [];
  if (!s.records || typeof s.records !== 'object' || Array.isArray(s.records)) s.records = {};
  if (!Array.isArray(s.foods)) s.foods = [];
  if (!s.diets || typeof s.diets !== 'object' || Array.isArray(s.diets)) s.diets = {};
  if (!s.dietGoals || typeof s.dietGoals !== 'object') s.dietGoals = {};
  s.dietGoals = Object.assign({}, DIET_GOAL_DEFAULT, s.dietGoals);
  if (!s.dietMealNotes || typeof s.dietMealNotes !== 'object') s.dietMealNotes = {};
  if (typeof s.dietRemoved !== 'boolean') s.dietRemoved = false;
  if (!Number.isFinite(s._rev) || s._rev < 0) s._rev = 0;
  return s;
}

// ===== 入口清洗：别人发来的 JSON 备份也要当成不可信输入 =====
// 分类 / 打卡项的 id 会被拼进 onclick="openXxx('id')"，一个带引号的 id
// 就能凭空多出一个事件处理器。所以 id 只认白名单，不合格的直接换新。
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function clipStr(v, max) {
  if (v == null) return '';
  return String(v).slice(0, max);
}

function sanitizeState(s) {
  const seenIds = new Set();
  const idMap = new Map();   // 旧 id → 新 id，records 里的引用要跟着换
  const takeId = (obj, prefix) => {
    const old = obj && obj.id;
    if (!old || !ID_RE.test(old) || seenIds.has(old)) {
      const nid = genId(prefix);
      // 旧 id 无论是「非法」还是「重复」，都把映射记下来，
      // records 里的引用才能跟着换，不然历史打卡会凭空消失
      if (typeof old === 'string' && old && !idMap.has(old)) idMap.set(old, nid);
      obj.id = nid;
    }
    seenIds.add(obj.id);
  };

  s.categories.forEach(cat => {
    if (!cat || typeof cat !== 'object') return;
    takeId(cat, 'cat');
    cat.name = clipStr(cat.name, 30) || '未命名分类';
    if (cat.startDate != null && !DATE_RE.test(String(cat.startDate))) delete cat.startDate;
    if (!Array.isArray(cat.items)) cat.items = [];
    cat.items = cat.items.filter(it => it && typeof it === 'object');
    cat.items.forEach(item => {
      takeId(item, 'item');
      item.name = clipStr(item.name, 30) || '未命名打卡项';
      if (item.quant && typeof item.quant === 'object') {
        const q = item.quant;
        q.unit = clipStr(q.unit, 10);
        if (!Number.isFinite(Number(q.target))) q.target = 0;
        if (q.compare !== 'lte') q.compare = 'gte';
      } else if (item.quant) {
        delete item.quant;   // quant 是 true / 字符串之类的脏数据，当普通项处理
      }
    });
  });

  // 记录里的 id 引用：换了 id 的要跟着换，指向已删除打卡项的直接丢掉
  Object.keys(s.records).forEach(key => {
    if (!DATE_RE.test(key)) { delete s.records[key]; return; }
    const arr = s.records[key];
    if (!Array.isArray(arr)) { delete s.records[key]; return; }
    s.records[key] = arr.map(r => {
      // 老格式是纯字符串 ["itemId"]，含义等于 { id, value: 1 }；
      // 这里必须保持原样，一旦统一成对象，value 会变成 0（= 没打卡）
      if (typeof r === 'string') return idMap.get(r) || r;
      if (!r || typeof r !== 'object') return null;
      if (idMap.has(r.id)) r.id = idMap.get(r.id);
      if (r.note != null) r.note = clipStr(r.note, 200);
      return r;
    }).filter(r => r && ID_RE.test(typeof r === 'string' ? r : String(r.id)));
  });

  // 饮食明细里的字符串也要截断（它们会被渲染成食物名）
  Object.keys(s.diets).forEach(key => {
    if (!DATE_RE.test(key)) { delete s.diets[key]; return; }
    const arr = s.diets[key];
    if (!Array.isArray(arr)) { delete s.diets[key]; return; }
    s.diets[key] = arr.filter(e => e && typeof e === 'object').map(e => {
      e.name = clipStr(e.name, 30);
      e.brand = clipStr(e.brand, 20);
      return e;
    });
  });

  Object.keys(s.dietMealNotes).forEach(key => {
    const m = s.dietMealNotes[key];
    if (!DATE_RE.test(key) || !m || typeof m !== 'object') { delete s.dietMealNotes[key]; return; }
    Object.keys(m).forEach(k => { m[k] = clipStr(m[k], 200); });
  });

  s.foods = s.foods.filter(f => f && typeof f === 'object').map(f => {
    if (!f.id || !ID_RE.test(String(f.id)) || seenIds.has(f.id)) f.id = genId('food');
    seenIds.add(f.id);
    f.name = clipStr(f.name, 30);
    f.brand = clipStr(f.brand, 20);
    if (!Number.isFinite(Number(f.kcal))) f.kcal = 0;
    if (f.kind !== 'drink') f.kind = 'food';
    return f;
  });

  return s;
}

// 统一补全 state 结构：旧本地缓存 / 旧 JSON 备份 / 云端旧记录都可能缺字段。
// 顺序不能反：先按版本迁移，再整形兜底，最后清洗入口数据。
function ensureStateShape() {
  if (!state || typeof state !== 'object' || Array.isArray(state)) state = makeEmptyState();
  let v = Number(state.schemaVersion);
  if (!Number.isFinite(v) || v < 1) v = 1;          // 没有版本号 = 第 1 版
  if (v > SCHEMA_VERSION) v = SCHEMA_VERSION;       // 未来版本的数据，别试图回调
  MIGRATIONS.forEach(m => {
    if (m.to > v) { m.up(state); v = m.to; }
  });
  state.schemaVersion = SCHEMA_VERSION;
  normalizeState(state);
  sanitizeState(state);
  ensureDietCategory();
  return state;
}

// 饮食记录作为一个「内置分类」存在 state.categories 里，
// 排序 / 改名 / 启用停用 / 纳入统计 全部复用已有的分类链路，不另开一套 UI。
function ensureDietCategory() {
  // 用户已经彻底删除过饮食分类：不再自动重建，只有清空数据才会回来
  if (state.dietRemoved) return null;
  let cat = (state.categories || []).find(c => c && c.builtin === 'diet');
  if (!cat) {
    cat = {
      id: DIET_CAT_ID,
      builtin: 'diet',
      name: '饮食记录',
      archived: false,
      enabled: true,
      countInStats: false,   // 默认不计入「今日完成」，否则三餐会把完成度拉低
      items: []
    };
    state.categories.push(cat);
  }
  if (!Array.isArray(cat.items)) cat.items = [];
  if (cat.enabled === undefined) cat.enabled = true;
  if (cat.countInStats === undefined) cat.countInStats = false;
  if (cat.archived === undefined) cat.archived = false;
  return cat;
}

function isDietCat(cat) { return !!(cat && cat.builtin === 'diet'); }
function getDietCat() { return (state.categories || []).find(c => isDietCat(c)) || null; }
function isCatEnabled(cat) { return !cat || cat.enabled !== false; }


function loadData() {
  const saved = localStorage.getItem(getStorageKey());
  if (saved) {
    try {
      state = JSON.parse(saved);
      ensureStateShape();
    } catch(e) {
      // Corrupted local cache: start empty, let cloud sync decide (cloud-first)
      console.error('Failed to load data', e);
      state = makeEmptyState();
    }
  } else {
    // No local cache (new device / after sign-out): start empty,
    // DO NOT load defaults yet — cloud sync will pull real data first.
    state = makeEmptyState();
  }
}

async function hashPassword(password, salt) {
  const encoder = new TextEncoder();
  const data = encoder.encode(salt + password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateSalt() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateToken() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}
