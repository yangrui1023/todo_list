// ===== Supabase Config =====
const SUPABASE_URL = 'https://rmqyyfoncddnfcaqiude.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tkJEszfUG7UXJxjvRPiuIw_QjpjJ2Ay';
const AUTH_SESSION_KEY = 'checkin_session';
const AUTH_USER_KEY = 'checkin_user';

let currentUser = null; // { id, email, token }
let syncTimer = null;
let pushDebounceTimer = null;
let isSyncing = false;
let lastSyncTime = 0;
let authMode = 'login'; // 'login' or 'register'

// ===== Password Hashing (Web Crypto API) =====
async function hashPassword(password, salt) {
  const encoder = new TextEncoder();
  const data = encoder.encode(salt + password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateSalt() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

function generateToken() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

// ===== Auth (Custom app_users table) =====
function getAuthSession() {
  return localStorage.getItem(AUTH_SESSION_KEY);
}

function getAuthUser() {
  const saved = localStorage.getItem(AUTH_USER_KEY);
  if (saved) {
    try { return JSON.parse(saved); } catch(e) { return null; }
  }
  return null;
}

function setAuthSession(user) {
  localStorage.setItem(AUTH_SESSION_KEY, user.token);
  localStorage.setItem(AUTH_USER_KEY, JSON.stringify(user));
  currentUser = user;
}

function clearAuthSession() {
  localStorage.removeItem(AUTH_SESSION_KEY);
  localStorage.removeItem(AUTH_USER_KEY);
  currentUser = null;
}

function switchAuthMode(mode) {
  authMode = mode;
  const btn = document.getElementById('authBtn');
  const subtitle = document.getElementById('authSubtitle');
  const toggle = document.getElementById('authToggle');
  const icon = document.getElementById('authIcon');
  const errEl = document.getElementById('authError');
  errEl.textContent = '';

  if (mode === 'register') {
    icon.textContent = '\u{1F4DD}';
    subtitle.textContent = '创建新账号';
    btn.textContent = '注册';
    toggle.innerHTML = '已有账号？<a onclick="switchAuthMode(\'login\')">去登录</a>';
  } else {
    icon.textContent = '\u{1F510}';
    subtitle.textContent = '登录你的账号';
    btn.textContent = '登录';
    toggle.innerHTML = '还没有账号？<a onclick="switchAuthMode(\'register\')">注册新账号</a>';
  }
  document.getElementById('authEmail').focus();
}

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('authBtn');

  if (!email || !password) {
    errEl.textContent = '请填写邮箱和密码';
    return;
  }
  if (password.length < 6) {
    errEl.textContent = '密码至少需要6位';
    return;
  }

  btn.disabled = true;
  btn.textContent = authMode === 'register' ? '注册中...' : '登录中...';
  errEl.textContent = '';

  try {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };

    if (authMode === 'register') {
      // Check if email already exists
      const checkUrl = `${SUPABASE_URL}/rest/v1/app_users?email=eq.${encodeURIComponent(email)}&select=id`;
      const checkRes = await fetch(checkUrl, { headers });
      const checkRows = await checkRes.json();
      if (checkRows && checkRows.length > 0) {
        throw new Error('该邮箱已被注册');
      }

      // Hash password and insert
      const salt = generateSalt();
      const passwordHash = await hashPassword(password, salt);
      const token = generateToken();

      const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/app_users`, {
        method: 'POST',
        headers: { ...headers, 'Prefer': 'return=representation' },
        body: JSON.stringify({
          email: email,
          password_hash: passwordHash,
          salt: salt,
          session_token: token
        })
      });

      if (!insertRes.ok) {
        const errData = await insertRes.json();
        throw new Error(errData.message || '注册失败');
      }

      const insertData = await insertRes.json();
      const user = { id: insertData[0].id, email: email, token: token };
      setAuthSession(user);
      enterApp();

    } else {
      // Login: fetch user by email
      const loginUrl = `${SUPABASE_URL}/rest/v1/app_users?email=eq.${encodeURIComponent(email)}&select=id,email,password_hash,salt,session_token`;
      const loginRes = await fetch(loginUrl, { headers });
      if (!loginRes.ok) throw new Error('登录失败，请重试');
      const rows = await loginRes.json();

      if (!rows || rows.length === 0) {
        throw new Error('账号不存在，请先注册');
      }

      const userRow = rows[0];
      const inputHash = await hashPassword(password, userRow.salt);

      if (inputHash !== userRow.password_hash) {
        throw new Error('密码错误');
      }

      // Generate new session token (invalidate old ones)
      const newToken = generateToken();
      const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${userRow.id}`, {
        method: 'PATCH',
        headers,
        body: JSON.stringify({ session_token: newToken })
      });

      if (!updateRes.ok) throw new Error('登录失败，请重试');

      const user = { id: userRow.id, email: userRow.email, token: newToken };
      setAuthSession(user);
      enterApp();
    }
  } catch(e) {
    errEl.textContent = e.message || '操作失败，请重试';
    btn.disabled = false;
    btn.textContent = authMode === 'register' ? '注册' : '登录';
  }
}

async function signOutUser() {
  if (!confirm('确定退出登录吗？')) return;
  // Optionally clear session token on server
  if (currentUser) {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };
    fetch(`${SUPABASE_URL}/rest/v1/app_users?id=eq.${currentUser.id}`, {
      method: 'PATCH',
      headers,
      body: JSON.stringify({ session_token: null })
    }).catch(() => {});
  }
  clearAuthSession();
  if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
  if (currentUser) localStorage.removeItem(`checkin_app_data_${currentUser.id}`);
  state = { categories: [], records: {} };
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').textContent = '';
  switchAuthMode('login');
}

function enterApp() {
  document.getElementById('authOverlay').classList.add('hidden');
  const badge = document.getElementById('userBadge');
  if (currentUser && currentUser.email) {
    badge.textContent = currentUser.email;
    badge.title = currentUser.email;
  }
  initApp();
}

// ===== Cloud Sync (user-isolated via session token) =====
function updateSyncStatus(status, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  const wrapper = document.getElementById('syncStatus');
  if (!dot || !txt) return;
  wrapper.style.display = 'flex';
  dot.className = 'sync-dot ' + status;
  txt.textContent = text;
}

function authHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function fetchCloudData() {
  if (!currentUser) return null;
  try {
    const url = `${SUPABASE_URL}/rest/v1/checkin_data?user_key=eq.${encodeURIComponent(currentUser.id)}&select=data,updated_at`;
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.length > 0 ? rows[0] : null;
  } catch(e) {
    console.error('Fetch cloud error:', e);
    return null;
  }
}

async function pushCloudData() {
  if (!currentUser || isSyncing) return false;
  isSyncing = true;
  updateSyncStatus('syncing', '同步中...');
  try {
    const url = `${SUPABASE_URL}/rest/v1/checkin_data?on_conflict=user_key`;
    const payload = {
      user_key: currentUser.id,
      data: state,
      updated_at: new Date().toISOString()
    };
    const res = await fetch(url, {
      method: 'POST',
      headers: { ...authHeaders(), 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(payload)
    });
    isSyncing = false;
    if (res.ok) {
      updateSyncStatus('online', '已同步');
      lastSyncTime = Date.now();
      return true;
    } else {
      updateSyncStatus('offline', '同步失败');
      return false;
    }
  } catch(e) {
    isSyncing = false;
    updateSyncStatus('offline', '网络错误');
    return false;
  }
}

function scheduleCloudPush() {
  if (!currentUser) return;
  if (pushDebounceTimer) clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(() => pushCloudData(), 1500);
}

async function syncFromCloud() {
  if (!currentUser || isSyncing) return;
  updateSyncStatus('syncing', '同步中...');
  const cloudRow = await fetchCloudData();
  if (!cloudRow) {
    // No cloud data yet. If this device has no local cache either, it's a brand
    // new user → seed default data (which also pushes to cloud). Otherwise push local.
    if (!localStorage.getItem(getStorageKey())) {
      loadDefaultData();
    } else {
      await pushCloudData();
    }
    return;
  }

  const cloudData = cloudRow.data;
  const cloudTime = new Date(cloudRow.updated_at).getTime();
  const localTime = state._updated_at ? new Date(state._updated_at).getTime() : 0;

  if (cloudTime > localTime) {
    state = cloudData;
    ensureStateShape();
    localStorage.setItem(getStorageKey(), JSON.stringify(state));
    const activeTab = document.querySelector('.tab.active');
    if (activeTab) {
      const tabName = activeTab.getAttribute('data-tab');
      if (tabName === 'checkin') renderCheckin();
      else if (tabName === 'stats') renderStats();
      else if (tabName === 'manage') renderManage();
      else if (tabName === 'foods') renderFoods();
    }
    updateSyncStatus('online', '已同步');
  } else if (localTime > cloudTime) {
    await pushCloudData();
  } else {
    updateSyncStatus('online', '已同步');
  }
  lastSyncTime = Date.now();
}

function startPeriodicSync() {
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(() => {
    if (currentUser && document.visibilityState === 'visible') {
      syncFromCloud();
    }
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && currentUser) {
      syncFromCloud();
    }
  });
}

function renderCloudStatus() {
  const statusDisplay = document.getElementById('cloudStatusDisplay');
  if (currentUser) {
    statusDisplay.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <span class="cloud-status-badge enabled">✅ 已登录</span>
        <button class="btn btn-danger" onclick="signOutUser()">退出登录</button>
      </div>
      <div style="font-size:13px; color:var(--text-muted);">
        当前账号: <code>${escapeHtml(currentUser.email)}</code><br>
        数据自动云端同步，多设备登录即可同步
      </div>
    `;
    updateSyncStatus('online', '已同步');
  } else {
    statusDisplay.innerHTML = `<span class="cloud-status-badge disabled">未登录</span>`;
  }
}

function genId(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function isToday(date) {
  return formatDate(date) === formatDate(new Date());
}

function getDayLabel(date) {
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(date);
  target.setHours(0,0,0,0);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return '今天';
  if (diff === -1) return '昨天';
  if (diff === 1) return '明天';
  return days[date.getDay()];
}

// ===== Tab Switching =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (tab === 'checkin') renderCheckin();
  if (tab === 'stats') renderStats();
  if (tab === 'manage') { renderManage(); renderCloudStatus(); }
  if (tab === 'foods') renderFoods();
}

// ===== Checkin Tab =====
// ---- Quant helpers ----
function isQuantItem(item) {
  return !!(item && item.quant && item.quant.unit != null && item.quant.target != null);
}
// Normalize a record entry -> { id, value, note } ; plain string treated as value=1 (checked)
function getRecordObj(rec) {
  if (typeof rec === 'object' && rec !== null) {
    return {
      id: rec.id,
      value: rec.value != null ? Number(rec.value) || 0 : 0,
      note: rec.note != null ? String(rec.note) : ''
    };
  }
  return { id: rec, value: 1, note: '' };
}
function getDayRecords(dateKey) {
  return (state.records[dateKey] || []).map(getRecordObj);
}
// Has a check-in record at all.
// A quant record counts as "checked-in" when a non-zero value was recorded;
// a zero value (incl. note-only records) means not checked-in.
// Negative values ARE treated as a real check-in.
function isChecked(rec) {
  return rec.value !== 0;
}
// Quant target met? 'gte' (>=, default) or 'lte' (<=)
function isQuantDone(rec, item) {
  const cmp = (item.quant && item.quant.compare) || 'gte';
  return cmp === 'lte' ? rec.value <= item.quant.target : rec.value >= item.quant.target;
}
// "Done" = checked AND reached target for quant items
function isDone(rec, item) {
  if (!isChecked(rec)) return false;
  if (isQuantItem(item)) return isQuantDone(rec, item);
  return true;
}
function getItemById(itemId) {
  for (const c of state.categories) {
    const it = c.items.find(i => i.id === itemId);
    if (it) return it;
  }
  return null;
}
function getItemCat(itemId) {
  return state.categories.find(c => c.items.some(i => i.id === itemId));
}
// Category participates in overall stats (countInStats defaults to true)
function isCatCounted(cat) {
  return cat.countInStats !== false;
}
function getDayCheckedIds(dateKey) {
  return getDayRecords(dateKey).filter(isChecked).map(r => r.id);
}
function getDayDoneIds(dateKey) {
  return getDayRecords(dateKey).filter(r => {
    const item = getItemById(r.id);
    return item && isDone(r, item);
  }).map(r => r.id);
}

function setNote(itemId, note) {
  const dateKey = formatDate(currentDate);
  const item = getItemById(itemId);
  if (!item) return;
  if (!state.records[dateKey]) state.records[dateKey] = [];
  const list = state.records[dateKey];
  const idx = list.findIndex(r => getRecordObj(r).id === itemId);
  const cur = idx > -1 ? getRecordObj(list[idx]) : { id: itemId, value: 0, note: '' };
  const newNote = note.trim();
  if (newNote) {
    const entry = { id: itemId, value: cur.value, note: newNote };
    if (idx > -1) list[idx] = entry; else list.push(entry);
  } else if (idx > -1) {
    // Remove note: keep the check-in record if a non-zero value exists (incl. negatives)
    if (cur.value !== 0) list[idx] = { id: itemId, value: cur.value };
    else list.splice(idx, 1);
  }
  if (list.length === 0) delete state.records[dateKey];
  saveData();
  renderCheckin();
}

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  renderCheckin();
}

function goToday() {
  currentDate = new Date();
  calMonth = new Date();
  renderCheckin();
}

// ===== Calendar =====
function toggleCalendar() {
  calendarOpen = !calendarOpen;
  const wrap = document.getElementById('calendarWrap');
  const btn = document.getElementById('calToggleBtn');
  if (calendarOpen) {
    calMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    renderCalendar();
    wrap.style.display = 'block';
    btn.style.background = 'var(--primary-light)';
  } else {
    wrap.style.display = 'none';
    btn.style.background = '';
  }
}

function changeCalMonth(delta) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  renderCalendar();
}

function renderCalendar() {
  const label = document.getElementById('calMonthLabel');
  label.textContent = `${calMonth.getFullYear()}年${calMonth.getMonth() + 1}月`;

  const grid = document.getElementById('calendarGrid');
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const firstDow = new Date(year, month, 1).getDay() || 7; // Mon=1..Sun=7
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = formatDate(new Date());
  const curKey = formatDate(currentDate);

  let html = ['周一','周二','周三','周四','周五','周六','周日'].map(w =>
    `<div class="cal-weekday">${w}</div>`).join('');

  // Leading blanks from previous month
  for (let i = 1; i < firstDow; i++) {
    const d = new Date(year, month, i - firstDow + 1);
    const key = formatDate(d);
    const cnt = getDayRecords(key).filter(isChecked).length;
    html += `<div class="cal-day other" onclick="selectCalDate('${key}')">
      ${d.getDate()}<div class="cal-count ${cnt === 0 ? 'zero' : ''}">${cnt}</div>
    </div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const cnt = getDayRecords(key).filter(isChecked).length;
    const cls = ['cal-day'];
    if (key === todayKey) cls.push('today');
    if (key === curKey) cls.push('selected');
    html += `<div class="${cls.join(' ')}" onclick="selectCalDate('${key}')">
      ${day}<div class="cal-count ${cnt === 0 ? 'zero' : ''}">${cnt}</div>
    </div>`;
  }

  grid.innerHTML = html;
}

function selectCalDate(dateKey) {
  currentDate = parseDate(dateKey);
  // Keep calendar open; user closes it by clicking the 📅 button again
  calMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
  renderCalendar();
  renderCheckin();
}

function toggleCheckin(itemId) {
  const dateKey = formatDate(currentDate);
  const item = getItemById(itemId);
  if (isQuantItem(item)) {
    // Quant items open the value input instead
    openQuantInput(itemId);
    return;
  }
  if (!state.records[dateKey]) state.records[dateKey] = [];
  const idx = state.records[dateKey].findIndex(r => getRecordObj(r).id === itemId);
  if (idx > -1) {
    state.records[dateKey].splice(idx, 1);
    if (state.records[dateKey].length === 0) delete state.records[dateKey];
  } else {
    state.records[dateKey].push(itemId);
  }
  saveData();
  renderCheckin();
}

function setQuantValue(itemId, value) {
  const dateKey = formatDate(currentDate);
  const num = Number(value);
  if (!state.records[dateKey]) state.records[dateKey] = [];
  const list = state.records[dateKey];
  const idx = list.findIndex(r => getRecordObj(r).id === itemId);
  const cur = idx > -1 ? getRecordObj(list[idx]) : { id: itemId, value: 0, note: '' };
  if (num !== 0) {
    // Store any non-zero value, including negatives (e.g. weight, profit/loss).
    const entry = { id: itemId, value: num, note: cur.note };
    if (idx > -1) list[idx] = entry; else list.push(entry);
  } else if (idx > -1) {
    list.splice(idx, 1); // value 0 -> remove (clears check-in)
  }
  if (list.length === 0) delete state.records[dateKey];
  saveData();
  renderCheckin();
}

function getStreak(itemId) {
  let streak = 0;
  const d = new Date();
  // If today not checked, start from yesterday
  const todayKey = formatDate(d);
  if (!getDayCheckedIds(todayKey).includes(itemId)) {
    d.setDate(d.getDate() - 1);
  }
  while (true) {
    const key = formatDate(d);
    if (getDayCheckedIds(key).includes(itemId)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function renderCheckin() {
  // Date bar
  document.getElementById('dayLabel').textContent = getDayLabel(currentDate);
  document.getElementById('dateValue').textContent =
    `${currentDate.getMonth() + 1}月${currentDate.getDate()}日`;
  document.getElementById('todayBtn').disabled = isToday(currentDate);

  // Progress (done = checked for plain items, reached target for quant items)
  // Only categories with countInStats participate in the progress total
  const allItems = state.categories
    .filter(c => !c.archived && isCatCounted(c))
    .flatMap(c => c.items.filter(i => !i.archived));
  const total = allItems.length;
  const dateKey = formatDate(currentDate);
  const doneIds = getDayDoneIds(dateKey);
  const done = doneIds.filter(id => allItems.some(i => i.id === id)).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;

  document.getElementById('progressCount').innerHTML =
    `<span class="done">${done}</span> / ${total}  (${pct}%)`;
  document.getElementById('progressBar').style.width = pct + '%';

  // List
  const list = document.getElementById('checkinList');
  const activeCats = state.categories.filter(c => !c.archived && (!c.startDate || dateKey >= c.startDate));
  if (activeCats.length === 0 || activeCats.every(c => c.items.filter(i => !i.archived).length === 0)) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📝</div><div class="text">还没有分类，去「分类管理」添加吧</div></div>`;
    return;
  }

  const dayRecs = getDayRecords(dateKey);
  let html = '';

  activeCats.forEach(cat => {
    const activeItems = cat.items.filter(i => !i.archived);
    if (activeItems.length === 0) return;
    const catDone = activeItems.filter(i => doneIds.includes(i.id)).length;
    const notCounted = !isCatCounted(cat);
    html += `<div class="category-card">
      <div class="category-header">
        <span class="category-name">${escapeHtml(cat.name)}${notCounted ? ' <span class="nocount-tag">不计统计</span>' : ''}</span>
        <span class="category-count">${catDone}/${activeItems.length}</span>
      </div>`;

    activeItems.forEach(item => {
      const rec = dayRecs.find(r => r.id === item.id);
      const isCheckedNow = rec ? isChecked(rec) : false;
      const isDoneNow = rec ? isDone(rec, item) : false;
      const streak = getStreak(item.id);
      const hasNote = !!(rec && rec.note);
      const noteTip = hasNote ? escapeHtml(rec.note).replace(/"/g, '&quot;') : '添加备注';
      // note text shown inline next to name (small font), 💬 always at far right
      const noteText = hasNote ? `<span class="checkin-note" title="${noteTip}">${escapeHtml(rec.note)}</span>` : '';
      const noteBtn = `<span class="note-btn ${hasNote ? 'has' : ''}" title="${noteTip}" onclick="event.stopPropagation(); openNoteModal('${item.id}')">💬</span>`;
      if (isQuantItem(item)) {
        const val = rec ? rec.value : 0;
        const target = item.quant.target;
        const unit = item.quant.unit;
        const doneClass = isDoneNow ? 'done' : (isCheckedNow ? 'partial' : '');
        html += `<div class="checkin-item ${isCheckedNow ? 'checked' : ''} ${doneClass}" onclick="openQuantInput('${item.id}')">
          <div class="checkin-checkbox">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <span class="checkin-item-name">${escapeHtml(item.name)}</span>
          ${noteText}
          <div class="checkin-right">
            <span class="quant-badge ${isDoneNow ? 'ok' : (isCheckedNow ? 'low' : '')}">${val}/${target} ${escapeHtml(unit)}</span>
            ${streak >= 2 ? `<span class="checkin-streak">🔥 ${streak}天</span>` : ''}
            ${noteBtn}
          </div>
        </div>`;
      } else {
        html += `<div class="checkin-item ${isCheckedNow ? 'checked' : ''}" onclick="toggleCheckin('${item.id}')">
          <div class="checkin-checkbox">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <span class="checkin-item-name">${escapeHtml(item.name)}</span>
          ${noteText}
          <div class="checkin-right">
            ${streak >= 2 ? `<span class="checkin-streak">🔥 ${streak}天</span>` : ''}
            ${noteBtn}
          </div>
        </div>`;
      }
    });
    html += `</div>`;
  });

  list.innerHTML = html;
}

// ===== Stats Tab =====
let statsOffset = 0; // 0 = current period, -1 prev, +1 next

// 自定义统计区间（currentPeriod === 'custom' 时生效）
let customRange = { start: '', end: '' };

function fmtDateInput(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function switchPeriod(period) {
  currentPeriod = period;
  statsOffset = 0;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.period-btn[data-period="${period}"]`);
  if (btn) btn.classList.add('active');

  if (period === 'custom') {
    if (!customRange.start || !customRange.end) {
      const end = new Date(); end.setHours(0, 0, 0, 0);
      const start = new Date(end); start.setDate(end.getDate() - 29);
      customRange.start = fmtDateInput(start);
      customRange.end = fmtDateInput(end);
    }
    const sEl = document.getElementById('statsCustomStart');
    const eEl = document.getElementById('statsCustomEnd');
    if (sEl) sEl.value = customRange.start;
    if (eEl) eEl.value = customRange.end;
  }
  renderStats();
}

function applyStatsCustomRange() {
  const sEl = document.getElementById('statsCustomStart');
  const eEl = document.getElementById('statsCustomEnd');
  const sv = (sEl && sEl.value) || '';
  const ev = (eEl && eEl.value) || '';
  if (!sv || !ev) { showToast('请选择开始和结束日期'); return; }
  if (sv > ev) { showToast('开始日期不能晚于结束日期'); return; }
  customRange.start = sv;
  customRange.end = ev;
  statsOffset = 0;
  renderStats();
}

function changeStatsOffset(delta) {
  statsOffset += delta;
  renderStats();
}

function resetStatsOffset() {
  statsOffset = 0;
  renderStats();
}

function getPeriodRange(period, offset) {
  offset = offset || 0;
  const now = new Date();
  let start, end, totalDays, label;
  if (period === 'custom') {
    let s = customRange.start ? new Date(customRange.start + 'T00:00:00') : null;
    let e = customRange.end ? new Date(customRange.end + 'T00:00:00') : null;
    if (!s || isNaN(s.getTime())) s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
    if (!e || isNaN(e.getTime())) e = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (s > e) { const t = s; s = e; e = t; }
    start = s; end = e;
    totalDays = Math.round((e - s) / 86400000) + 1;
    const sameYear = s.getFullYear() === e.getFullYear();
    label = sameYear
      ? `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()}`
      : `${s.getFullYear()}/${s.getMonth()+1}/${s.getDate()} - ${e.getFullYear()}/${e.getMonth()+1}/${e.getDate()}`;
    return { start, end, totalDays, label };
  }
  if (period === 'week') {
    start = new Date(now);
    const day = now.getDay() || 7; // Mon=1..Sun=7
    start.setDate(now.getDate() - day + 1 + offset * 7);
    start.setHours(0,0,0,0);
    end = new Date(start);
    end.setDate(start.getDate() + 6);
    totalDays = 7;
    label = `${start.getMonth()+1}/${start.getDate()} - ${end.getMonth()+1}/${end.getDate()}`;
  } else if (period === 'month') {
    start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1 + offset, 0);
    totalDays = end.getDate();
    label = `${start.getFullYear()}年${start.getMonth()+1}月`;
  } else {
    const y = now.getFullYear() + offset;
    start = new Date(y, 0, 1);
    end = new Date(y, 11, 31);
    totalDays = isLeapYear(y) ? 366 : 365;
    label = `${y}年`;
  }
  return { start, end, totalDays, label };
}

function isLeapYear(y) {
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function countInRange(itemId, start, end) {
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const key = formatDate(d);
    if (getDayCheckedIds(key).includes(itemId)) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

// Days in range where the item reached its quant target (plain items count as checked)
function countDoneInRange(item, start, end) {
  let count = 0;
  const d = new Date(start);
  while (d <= end) {
    const key = formatDate(d);
    const rec = getDayRecords(key).find(r => r.id === item.id);
    if (rec && isDone(rec, item)) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}

// Sum of quant values in range (plain items count 1 per check-in)
function sumValueInRange(item, start, end) {
  let sum = 0;
  const d = new Date(start);
  while (d <= end) {
    const key = formatDate(d);
    const rec = getDayRecords(key).find(r => r.id === item.id);
    if (rec && isChecked(rec)) sum += isQuantItem(item) ? rec.value : 1;
    d.setDate(d.getDate() + 1);
  }
  return sum;
}

// Daily quant values in range -> [{key, value}]
// value 为数字 = 当天有填；null = 没填（绝不能当成 0，否则体重折线会一路掉到 0）
// 默认裁掉「今天之后」的日期：还没到的日子不该出现在折线里
function dailyValuesInRange(item, start, end, opts) {
  const trimFuture = !(opts && opts.trimFuture === false);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = [];
  const d = new Date(start);
  d.setHours(0, 0, 0, 0);
  while (d <= end) {
    if (trimFuture && d > today) break;
    const key = formatDate(d);
    const rec = getDayRecords(key).find(r => r.id === item.id);
    days.push({ key, value: (rec && isChecked(rec)) ? rec.value : null });
    d.setDate(d.getDate() + 1);
  }
  return days;
}

// ===== 图表公共：刻度取整 + 坐标范围 =====

// 刻度步长取 1 / 2 / 2.5 / 5 × 10^k，避免左侧出现 6.85 这类难读的刻度。
// 分界点故意偏松（1.5 / 3 / 4.5 / 7），让步长尽量小，刻度跨度不会被拱大。
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const exp = Math.floor(Math.log10(raw));
  const base = Math.pow(10, exp);
  const f = raw / base;
  const m = f < 1.5 ? 1 : (f < 3 ? 2 : (f < 4.5 ? 2.5 : (f < 7 ? 5 : 10)));
  return m * base;
}

// 步长按 1 → 2 → 2.5 → 5 → 10 往上跳一档（刻度太密时用）
function bumpStep(step) {
  const exp = Math.floor(Math.log10(step));
  const base = Math.pow(10, exp);
  const m = Math.round((step / base) * 100) / 100;
  if (m < 1.5) return 2 * base;
  if (m < 2.25) return 2.5 * base;
  if (m < 3.5) return 5 * base;
  if (m < 7.5) return 10 * base;
  return 20 * base;
}

// 刻度数字：小数位由步长决定（步长 0.05 显示两位，步长 5 不带小数）
function fmtTick(v, step) {
  const dec = (String(Number(step.toFixed(6))).split('.')[1] || '').length;
  return v.toFixed(dec);
}

// 坐标轴范围（小图/大图共用）
// 1) 贴合「有填」的数据，只有数据靠近 0 时才保留 0 基线
//    —— 否则体重 67~68 这类指标会被压成一条直线；
// 2) 目标线尽量纳入视野，但最多把一侧撑到数据跨度的 1.5 倍，
//    否则目标离实际值太远（目标 40、实际 0~2）时整张图只剩贴底的一条线；
// 3) 目标正好落在数据边缘时，往达标那一侧留一点余量，
//    否则「达标区」高度为 0，看不出方向；
// 4) 上下界对齐到刻度步长，左侧标签只会是整数或一两位小数。
function chartRange(values, target, opts) {
  opts = opts || {};
  const tickCount = opts.ticks || 4;
  const goodAbove = opts.goodAbove !== false;

  const nums = (values || [])
    .filter(v => v !== null && v !== undefined && v !== '')
    .map(Number)
    .filter(v => isFinite(v));
  const t = Number(target);
  const hasT = target !== null && target !== undefined && target !== '' && isFinite(t);

  let lo, hi;
  if (nums.length) {
    lo = Math.min.apply(null, nums);
    hi = Math.max.apply(null, nums);
  } else if (hasT) {
    lo = t; hi = t;
  } else {
    lo = 0; hi = 1;
  }
  const dataMin = nums.length ? lo : null;

  // 只有一个值 / 所有值都相同：以它为中心开一个小窗口，否则没有图可画
  const flat = (hi - lo) === 0;
  const nominal = flat ? Math.max(Math.abs(hi) * 0.2, 1) : (hi - lo);
  if (flat) { lo -= nominal / 2; hi += nominal / 2; }

  // 数据贴近 0 时保留 0 基线（喝水、次数这类从 0 起量更直观）
  if (lo > 0 && lo <= nominal * 0.5) lo = 0;
  if (hi < 0 && -hi <= nominal * 0.5) hi = 0;

  // 目标线是否放进视野
  let targetInView = false, offHigh = false, offLow = false;
  if (hasT) {
    if (t >= lo && t <= hi) {
      targetInView = true;
    } else if (t > hi) {
      if (flat || t - hi <= nominal * 1.5) { hi = t; targetInView = true; }
      else offHigh = true;
    } else {
      if (flat || lo - t <= nominal * 1.5) { lo = t; targetInView = true; }
      else offLow = true;
    }
  }

  // 目标贴在边缘时，往达标侧留 12% 余量，让「达标区」看得见
  if (targetInView) {
    const spanN = (hi - lo) || nominal;
    const bandPad = spanN * 0.12;
    if (goodAbove && t + bandPad > hi) hi = t + bandPad;
    if (!goodAbove && t - bandPad < lo) lo = t - bandPad;
  }

  // 数据本身非负时，别在 0 下面凭空造出一段负刻度
  if (dataMin !== null && dataMin >= 0 && lo < 0 && -lo <= (hi - lo) * 0.05) lo = 0;

  // 步长从小往大试，取「刻度不超过 7 个」的最小步长：
  // 步子太碎会出现 0.25、7.75 这种密集又难读的刻度
  let step = niceStep((hi - lo) / tickCount);
  let min = 0, max = 1, ticks = [];
  for (let guard = 0; guard < 8; guard++) {
    const dec = (String(Number(step.toFixed(6))).split('.')[1] || '').length;
    const rnd = v => Number(v.toFixed(dec + 3));
    min = rnd(Math.floor(lo / step + 1e-9) * step);
    max = rnd(Math.ceil(hi / step - 1e-9) * step);
    if (!(max > min)) max = rnd(min + step);
    const n = Math.round((max - min) / step);
    ticks = [];
    for (let k = 0; k <= n; k++) ticks.push(rnd(min + k * step));
    if (ticks.length <= 7) break;
    step = bumpStep(step);
  }

  // 目标线正好压在上/下边界上时（lte 目标高于所有数据很常见），
  // 补一格让虚线落在图内，否则它看着就像边框
  if (targetInView && ticks.length) {
    const eps = step / 1000;
    if (Math.abs(max - t) < eps) {
      max = Number((max + step).toFixed(6));
      ticks.push(max);
    } else if (Math.abs(t - min) < eps) {
      min = Number((min - step).toFixed(6));
      ticks.unshift(min);
    }
  }

  return { min, max, step, ticks, targetInView, offHigh, offLow };
}

// 达标区阴影：gte 达标区在目标线以上，lte 在以下 —— 一眼看出哪一侧更好
function goodZoneRect(target, minV, maxV, goodAbove, y) {
  const zLo = goodAbove ? Math.max(Number(target), minV) : minV;
  const zHi = goodAbove ? maxV : Math.min(Number(target), maxV);
  if (!(zHi > zLo)) return null;
  const zt = y(zHi), zb = y(zLo);
  return { top: zt, height: zb - zt };
}

// SVG line chart (no external deps); supports negative values and compare direction
function renderTrendSvg(item, days) {
  const W = 300, H = 64, padL = 30, padB = 14, padT = 8, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const target = item.quant.target;
  const cmp = (item.quant && item.quant.compare) || 'gte';
  const goodAbove = cmp !== 'lte';   // gte：目标线以上算达标；lte：以下算达标
  const n = days.length;
  // 只画「有填」的点，没填的日子直接跳过（跨过去连直线，不补 0）
  const filled = days.map((d, i) => ({ i: i, v: d.value })).filter(p => p.v != null);
  if (filled.length === 0) {
    return `<div class="trend-empty">本区间暂无记录</div>`;
  }

  const rng = chartRange(filled.map(p => p.v), target, { ticks: 4, goodAbove });
  const minV = rng.min, maxV = rng.max;
  const range = (maxV - minV) || 1;
  const x = i => padL + (n <= 1 ? plotW / 2 : i * plotW / (n - 1));
  const y = v => padT + plotH - ((v - minV) / range) * plotH;

  const zoneRect = goodZoneRect(target, minV, maxV, goodAbove, y);
  const zone = zoneRect
    ? `<rect x="${padL}" y="${zoneRect.top.toFixed(1)}" width="${plotW}" height="${zoneRect.height.toFixed(1)}" fill="#059669" opacity="0.09"/>`
    : '';

  // 目标线：在视野内才画；超出视野时只留文字标注（画一条贴边虚线容易被当成图表边框），
  // 也绝不为了画出目标把刻度拉得过大
  let targetLine = '', labelY;
  if (rng.targetInView) {
    const ty = y(Number(target)).toFixed(1);
    const tyNum = Number(ty);
    labelY = (tyNum - 4) < (padT + 5) ? (tyNum + 9) : (tyNum - 4);
    targetLine = `<line x1="${padL}" y1="${ty}" x2="${W - padR}" y2="${ty}" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3" opacity="0.75"/>`;
  } else {
    labelY = rng.offHigh ? (padT + 8) : (padT + plotH - 1);
  }

  const hitFn = goodAbove ? (v => v >= target) : (v => v <= target);
  const dots = filled.map(p => {
    const px = x(p.i).toFixed(1), py = y(p.v).toFixed(1);
    const hit = hitFn(p.v);
    return `<circle cx="${px}" cy="${py}" r="2.8" fill="${hit ? '#059669' : '#d97706'}" stroke="#fff" stroke-width="1"/>`;
  }).join('');

  let path = '';
  filled.forEach((p, k) => {
    const px = x(p.i).toFixed(1), py = y(p.v).toFixed(1);
    path += (k === 0 ? `M ${px} ${py}` : ` L ${px} ${py}`);
  });

  return `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    ${zone}
    ${targetLine}
    <path d="${path}" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${W - padR}" y="${labelY}" text-anchor="end" font-size="9" fill="#dc2626" opacity="0.9" paint-order="stroke" stroke="#fff" stroke-width="2.6" stroke-linejoin="round">目标 ${target} ${goodAbove ? '↑' : '↓'}</text>
  </svg>`;
}

function renderStats() {
  const { start, end, totalDays, label } = getPeriodRange(currentPeriod, statsOffset);

  // 自定义区间：显示日期选择条，隐藏「上一/下一周期」（对自定义区间无意义）
  const customBox = document.getElementById('statsCustomRange');
  if (customBox) customBox.style.display = currentPeriod === 'custom' ? 'flex' : 'none';
  const navBox = document.querySelector('.stats-period-nav');
  if (navBox) navBox.style.display = currentPeriod === 'custom' ? 'none' : 'flex';
  if (currentPeriod === 'custom') {
    const sEl = document.getElementById('statsCustomStart');
    const eEl = document.getElementById('statsCustomEnd');
    if (sEl && !sEl.value) sEl.value = customRange.start;
    if (eEl && !eEl.value) eEl.value = customRange.end;
  }

  // Update period nav label (‹ range ›); badge marks current period only
  const navLabel = document.getElementById('statsPeriodLabel');
  if (navLabel) {
    const periodName = currentPeriod === 'week' ? '周'
      : (currentPeriod === 'month' ? '月' : (currentPeriod === 'year' ? '年' : '自定义'));
    const badge = (statsOffset === 0 && currentPeriod !== 'custom')
      ? `<span class="nav-badge">本${periodName}</span>` : '';
    navLabel.innerHTML = badge + label;
    navLabel.title = statsOffset === 0 ? `当前${periodName}，点击无变化` : `点击回到当前${periodName}`;
  }

  // Summary only counts categories with countInStats enabled
  const statsItems = state.categories
    .filter(c => isCatCounted(c))
    .flatMap(c => c.items);
  const total = statsItems.length;

  // Summary
  let totalCheckins = 0;
  let activeDays = new Set();
  statsItems.forEach(item => {
    const d = new Date(start);
    while (d <= end) {
      const key = formatDate(d);
      if (getDayCheckedIds(key).includes(item.id)) {
        totalCheckins++;
        activeDays.add(key);
      }
      d.setDate(d.getDate() + 1);
    }
  });

  const avgPerDay = totalCheckins / totalDays;
  const completionRate = total > 0 ? Math.round(totalCheckins / (total * totalDays) * 100) : 0;

  document.getElementById('statsSummary').innerHTML = `
    <div class="stats-summary-card">
      <div class="stats-summary-value">${totalCheckins}</div>
      <div class="stats-summary-label">总打卡次数</div>
    </div>
    <div class="stats-summary-card">
      <div class="stats-summary-value">${activeDays.size}</div>
      <div class="stats-summary-label">活跃天数</div>
    </div>
    <div class="stats-summary-card">
      <div class="stats-summary-value">${completionRate}%</div>
      <div class="stats-summary-label">完成率</div>
    </div>
  `;

  // Detailed list
  const list = document.getElementById('statsList');
  if (state.categories.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📊</div><div class="text">还没有打卡数据</div></div>`;
    return;
  }

  let html = `<div style="text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:14px;">${label} · 共${totalDays}天</div>`;

  // Color palette for bars
  const colors = ['#4f46e5', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

  state.categories.forEach((cat, catIdx) => {
    if (cat.items.length === 0) return;
    // Hide non-counted categories from the stats page entirely
    if (!isCatCounted(cat)) return;
    // Hide categories whose start date is after the period end (not yet active)
    const endKey = formatDate(end);
    if (cat.startDate && endKey < cat.startDate) return;
    const color = colors[catIdx % colors.length];
    const catArchived = cat.archived;

    html += `<div class="stats-category-card${catArchived ? ' archived' : ''}">
      <div class="category-header">
        <span class="category-name">${escapeHtml(cat.name)}${catArchived ? ' <span class="archived-tag">已归档</span>' : ''}</span>
      </div>`;

    cat.items.forEach(item => {
      const count = countInRange(item.id, start, end);
      const pct = totalDays > 0 ? Math.round(count / totalDays * 100) : 0;
      const streak = getStreak(item.id);
      const totalCount = getTotalCount(item.id);
      const itemArchived = catArchived || item.archived;

      if (isQuantItem(item)) {
        // ---- Quant item: unified row + value totals + trend chart ----
        const isLte = (item.quant.compare || 'gte') === 'lte';
        const doneDays = countDoneInRange(item, start, end);
        const sumVal = sumValueInRange(item, start, end);
        const planVal = item.quant.target * totalDays;
        const unit = item.quant.unit;
        const daily = dailyValuesInRange(item, start, end);
        // gte: 累积完成值 / 计划值; lte: 达标天数占比
        const rateVal = isLte
          ? Math.round(doneDays / totalDays * 100)
          : Math.round(sumVal / Math.max(planVal, 1) * 100);

        html += `<div class="stats-item-row quant-row${itemArchived ? ' archived' : ''}" onclick="openTrendModal('${item.id}')" style="cursor:pointer" title="点击查看趋势大图">
          <div class="stats-item-header">
            <span class="stats-item-name">${escapeHtml(item.name)}${item.archived && !catArchived ? ' <span class="archived-tag">已归档</span>' : ''}<span class="quant-target-tag">🎯 ${item.quant.target}${escapeHtml(unit)}/天</span></span>
            <span class="stats-item-freq">
              <span class="current">${doneDays}</span><span class="total">/${totalDays}天</span>
            </span>
          </div>
          <div class="stats-item-bar">
            <div class="stats-item-bar-fill" style="width:${Math.min(100, rateVal)}%; background:${color};"></div>
          </div>
          ${renderTrendSvg(item, daily)}
          <div class="stats-item-meta">
            <span>${isLte ? '达标率' : '完成率'} ${rateVal}%</span>
            <span class="quant-sum">${isLte ? `合计 ${sumVal}` : `总完成 ${sumVal}/${planVal}`} ${escapeHtml(unit)}</span>
            <span>🔥 连续${streak}天 · 累计${totalCount}次</span>
          </div>
        </div>`;
      } else {
        html += `<div class="stats-item-row${itemArchived ? ' archived' : ''}">
          <div class="stats-item-header">
            <span class="stats-item-name">${escapeHtml(item.name)}${item.archived && !catArchived ? ' <span class="archived-tag">已归档</span>' : ''}</span>
            <span class="stats-item-freq">
              <span class="current">${count}</span><span class="total">/${totalDays}</span>
            </span>
          </div>
          <div class="stats-item-bar">
            <div class="stats-item-bar-fill" style="width:${pct}%; background:${color};"></div>
          </div>
          <div class="stats-item-meta">
            <span>完成率 ${pct}%</span>
            <span>🔥 连续${streak}天 · 累计${totalCount}次</span>
          </div>
        </div>`;
      }
    });
    html += `</div>`;
  });

  list.innerHTML = html;
}

function getTotalCount(itemId) {
  let count = 0;
  Object.keys(state.records).forEach(key => {
    if (getDayCheckedIds(key).includes(itemId)) count++;
  });
  return count;
}

// ===== Generic Edit Modal =====
let editModalState = null;

// 一键切换正负号（解决手机端数字键盘无负号键的问题）
function toggleSign(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const v = el.value.trim();
  el.value = v.startsWith('-') ? v.slice(1) : '-' + v;
  el.focus();
}

// 输入净化：仅保留可选前导负号 + 数字 + 单个小数点（兼容逗号作小数点）
function sanitizeNumberInput(el) {
  let v = el.value;
  const neg = v.trim().startsWith('-');
  let digits = v.replace(/[^0-9.,]/g, '').replace(/,/g, '.');
  const dot = digits.indexOf('.');
  if (dot !== -1) digits = digits.slice(0, dot + 1) + digits.slice(dot + 1).replace(/\./g, '');
  el.value = (neg ? '-' : '') + digits;
}

function openEditModal(title, sub, bodyHtml, state, okLabel) {
  document.getElementById('editModalTitle').textContent = title;
  document.getElementById('editModalSub').textContent = sub || '';
  document.getElementById('editModalBody').innerHTML = bodyHtml;
  document.getElementById('editModalOk').textContent = okLabel || '确定';
  editModalState = state;
  document.getElementById('editModal').classList.add('show');
  const first = document.querySelector('#editModalBody input');
  if (first) setTimeout(() => first.focus(), 50);
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editModalState = null;
}

function toggleQuantFields() {
  const on = document.getElementById('modalQuantOn').checked;
  document.getElementById('quantFields').style.display = on ? 'block' : 'none';
}

function confirmEditModal() {
  const s = editModalState;
  if (!s) return;
  if (s.type === 'editCat') {
    const v = document.getElementById('modalInput1').value.trim();
    if (!v) { showToast('请输入名称'); return; }
    const cat = state.categories.find(c => c.id === s.catId);
    if (cat) {
      cat.name = v;
      saveData();
      renderManage();
      showToast('分类名称已修改');
    }
  } else if (s.type === 'editItem') {
    const v = document.getElementById('modalInput1').value.trim();
    if (!v) { showToast('请输入名称'); return; }
      const cat = state.categories.find(c => c.id === s.catId);
      const item = cat && cat.items.find(i => i.id === s.itemId);
      if (item) {
        item.name = v;
        const quantOn = document.getElementById('modalQuantOn').checked;
        if (quantOn) {
          const unit = document.getElementById('modalUnit').value.trim();
          const target = parseFloat(document.getElementById('modalTarget').value.replace(',', '.'));
          const compare = document.getElementById('modalCompare').value || 'gte';
          if (!unit) { showToast('请输入量化单位'); return; }
          if (isNaN(target)) { showToast('请输入有效的目标数值'); return; }
          item.quant = { unit: unit, target: target, compare: compare };
        } else {
          delete item.quant;
        }
        saveData();
        renderManage();
        showToast('打卡项已修改');
      }
  } else if (s.type === 'editFood') {
    const f = getFoods().find(x => x.id === s.id);
    if (!f) return;
    const kind = (document.getElementById('modalFoodKind') || {}).value || 'food';
    const brand = ((document.getElementById('modalFoodBrand') || {}).value || '').trim();
    const name = ((document.getElementById('modalFoodName') || {}).value || '').trim();
    const kcalRaw = ((document.getElementById('modalFoodKcal') || {}).value || '').replace(/[^0-9.]/g, '');
    const kcal = parseFloat(kcalRaw);
    if (!brand) { showToast('请填写品牌'); return; }
    if (!name) { showToast('请填写食物名称'); return; }
    if (!kcalRaw || isNaN(kcal) || kcal < 0) { showToast('请填写正确的热量数值'); return; }
    f.kind = kind; f.brand = brand; f.name = name; f.kcal = Math.round(kcal);
    saveData();
    renderFoods();
    showToast('已保存');
  } else if (s.type === 'addFood') {
    if (!addFood()) return;   // 校验失败时保持弹窗打开
    closeEditModal();
    return;
  } else if (s.type === 'quantExport') {
    const sv = ((document.getElementById('expStart') || {}).value || '').trim();
    const ev = ((document.getElementById('expEnd') || {}).value || '').trim();
    if (!sv || !ev) { showToast('请选择开始和结束日期'); return; }
    const d1 = new Date(sv + 'T00:00:00');
    const d2 = new Date(ev + 'T00:00:00');
    if (isNaN(d1.getTime()) || isNaN(d2.getTime())) { showToast('日期无效'); return; }
    if (d1 > d2) { showToast('开始日期不能晚于结束日期'); return; }
    const ids = Array.prototype.slice.call(document.querySelectorAll('.exp-item:checked')).map(el => el.value);
    if (ids.length === 0) { showToast('请至少选择一个指标'); return; }
    exportQuantCsv(d1, d2, ids);
  } else if (s.type === 'trendView') {
    closeEditModal();
    return;
  } else if (s.type === 'quantInput') {
    const input = document.getElementById('modalQuantValue');
    const raw = input.value.trim();
    const num = raw === '' ? 0 : parseFloat(raw.replace(',', '.'));
    if (isNaN(num)) { showToast('请输入有效数值'); return; }
    setQuantValue(s.itemId, num);
    showToast(num !== 0 ? '已记录' : '已取消打卡');
  } else if (s.type === 'note') {
    const note = document.getElementById('modalNote').value;
    setNote(s.itemId, note);
    showToast(note.trim() ? '备注已保存' : '备注已清除');
  } else if (s.type === 'setStartDate') {
    const date = document.getElementById('modalStartDate').value;
    const cat = state.categories.find(c => c.id === s.catId);
    if (cat) {
      cat.startDate = date || undefined;
      saveData();
      renderManage();
      showToast(date ? `开始日期设为 ${date}` : '已清除开始日期（立即生效）');
    }
  }
  closeEditModal();
}

// ===== Manage Tab =====
function renderManage() {
  // Category list
  const list = document.getElementById('manageList');
  if (state.categories.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📁</div><div class="text">还没有分类</div></div>`;
    return;
  }

  const activeCats = state.categories.filter(c => !c.archived);
  const archivedCats = state.categories.filter(c => c.archived);
  let html = '';

  // Active categories
  activeCats.forEach(cat => {
    const activeItems = cat.items.filter(i => !i.archived);
    const archivedItems = cat.items.filter(i => i.archived);

    const startDateTag = cat.startDate ? ` <span class="startdate-tag">📅 ${cat.startDate} 起</span>` : '';
    html += `<div class="manage-category">
      <div class="manage-category-header">
        <span class="name">${escapeHtml(cat.name)}${!isCatCounted(cat) ? ' <span class="nocount-tag">不计统计</span>' : ''}${startDateTag}</span>
        <button class="action-trigger" onclick="event.stopPropagation(); toggleCatMenu('${cat.id}')" title="更多操作" aria-label="更多操作">⋮</button>
        <div class="action-menu" id="catMenu_${cat.id}">
          <div class="action-menu-item" onclick="event.stopPropagation(); toggleCountInStats('${cat.id}')">
            <span><span class="menu-icon">📊</span>纳入统计</span>
            <span class="switch-track ${isCatCounted(cat) ? 'on' : ''}"><span class="switch-knob"></span></span>
          </div>
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); moveCategory('${cat.id}', -1)">
            <span><span class="menu-icon">⬆️</span>上移</span>
          </div>
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); moveCategory('${cat.id}', 1)">
            <span><span class="menu-icon">⬇️</span>下移</span>
          </div>
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); editCategoryName('${cat.id}')">
            <span><span class="menu-icon">✏️</span>编辑名称</span>
          </div>
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); setCategoryStartDate('${cat.id}')">
            <span><span class="menu-icon">📅</span>开始日期${cat.startDate ? '：' + cat.startDate : ''}</span>
          </div>
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); archiveCategory('${cat.id}')">
            <span><span class="menu-icon">📦</span>归档分类</span>
          </div>
          <div class="action-menu-item danger" onclick="event.stopPropagation(); closeAllMenus(); permanentDeleteCategory('${cat.id}')">
            <span><span class="menu-icon">🗑️</span>删除分类</span>
          </div>
        </div>
      </div>`;

    activeItems.forEach(item => {
      html += `<div class="manage-item-row">
        <span class="name">${escapeHtml(item.name)}${isQuantItem(item) ? ` <span class="quant-mini">🎯 ${item.quant.target} ${escapeHtml(item.quant.unit)}/天</span>` : ''}</span>
        <button class="action-trigger" onclick="event.stopPropagation(); toggleItemMenu('${item.id}')" title="更多操作" aria-label="更多操作">⋮</button>
        <div class="action-menu" id="itemMenu_${item.id}">
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); editItemConfig('${cat.id}', '${item.id}')">
            <span><span class="menu-icon">✏️</span>编辑</span>
          </div>
          <div class="action-menu-item" onclick="event.stopPropagation(); closeAllMenus(); archiveItem('${cat.id}', '${item.id}')">
            <span><span class="menu-icon">📦</span>归档</span>
          </div>
          <div class="action-menu-item danger" onclick="event.stopPropagation(); closeAllMenus(); permanentDeleteItem('${cat.id}', '${item.id}')">
            <span><span class="menu-icon">🗑️</span>删除</span>
          </div>
        </div>
      </div>`;
    });

    html += `<div class="manage-add-item">
      <input type="text" placeholder="添加打卡项..." maxlength="30"
        onkeydown="if(event.key==='Enter') addItem('${cat.id}', this)"
        id="addItem_${cat.id}">
      <button class="btn btn-primary" onclick="addItem('${cat.id}', document.getElementById('addItem_${cat.id}'))">添加</button>
    </div>`;

    // Archived items under this active category
    if (archivedItems.length > 0) {
      html += `<div class="archived-section">
        <div class="archived-section-title">已归档打卡项</div>`;
      archivedItems.forEach(item => {
        html += `<div class="manage-item-row archived">
          <span class="name">${escapeHtml(item.name)} <span class="archived-tag">已归档</span></span>
          <button class="btn btn-outline btn-sm" title="编辑" onclick="editItemConfig('${cat.id}', '${item.id}')">编辑</button>
          <button class="btn btn-success" onclick="restoreItem('${cat.id}', '${item.id}')">恢复</button>
          <button class="btn btn-danger" onclick="permanentDeleteItem('${cat.id}', '${item.id}')">彻底删除</button>
        </div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;
  });

  // Archived categories
  if (archivedCats.length > 0) {
    html += `<div class="archived-categories">
      <div class="archived-categories-title">📦 已归档分类</div>`;
    archivedCats.forEach(cat => {
      html += `<div class="manage-category archived">
        <div class="manage-category-header">
          <span class="name">${escapeHtml(cat.name)} <span class="archived-tag">已归档</span></span>
          <button class="btn btn-success" onclick="restoreCategory('${cat.id}')">恢复</button>
          <button class="btn btn-danger" onclick="permanentDeleteCategory('${cat.id}')">彻底删除</button>
        </div>`;
      cat.items.forEach(item => {
        html += `<div class="manage-item-row archived">
          <span class="name">${escapeHtml(item.name)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  list.innerHTML = html;
}

function selectIcon(icon) {
  selectedIcon = icon;
  renderManage();
}

function toggleCatMenu(catId) {
  const menu = document.getElementById('catMenu_' + catId);
  if (!menu) return;
  const willOpen = !menu.classList.contains('show');
  closeAllMenus();
  if (willOpen) menu.classList.add('show');
}

function toggleItemMenu(itemId) {
  const menu = document.getElementById('itemMenu_' + itemId);
  if (!menu) return;
  const willOpen = !menu.classList.contains('show');
  closeAllMenus();
  if (willOpen) menu.classList.add('show');
}

function closeAllMenus() {
  document.querySelectorAll('.action-menu.show').forEach(m => m.classList.remove('show'));
}

// Close menus when clicking outside
document.addEventListener('click', closeAllMenus);

function toggleCountInStats(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.countInStats = cat.countInStats === false; // toggle to true if currently false
  saveData();
  renderManage();
  showToast(cat.countInStats === false ? '已改为不计统计' : '已纳入统计');
  // Reopen the menu so user can toggle repeatedly without reopening
  const menu = document.getElementById('catMenu_' + catId);
  if (menu) menu.classList.add('show');
}

function moveCategory(catId, direction) {
  const idx = state.categories.findIndex(c => c.id === catId);
  if (idx < 0) return;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= state.categories.length) {
    showToast(direction < 0 ? '已经在最上面' : '已经在最下面');
    return;
  }
  const [moved] = state.categories.splice(idx, 1);
  state.categories.splice(newIdx, 0, moved);
  saveData();
  renderManage();
  showToast(direction < 0 ? '已上移' : '已下移');
}

function setCategoryStartDate(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  const current = cat.startDate || '';
  openEditModal(`${escapeHtml(cat.name)} · 开始日期`, '设置后，该分类仅在此日期及之后出现在打卡页',
    `<label>开始日期（留空 = 立即生效）</label>
     <input type="date" class="modal-input" id="modalStartDate" value="${current}">
     <div class="quant-input-tip">例如：计划 9 月开始健身，设为 2026-09-01，之前打卡页不显示该分类</div>`,
    { type: 'setStartDate', catId: catId }, '保存');
}

function openNoteModal(itemId) {
  const item = getItemById(itemId);

  const dateKey = formatDate(currentDate);

function editCategoryName(catId) {

    `<label>分类名称</label>

       <span class="quant-unit">${escapeHtml(item.quant.unit)}</span>
     </div>
     <div class="quant-input-tip">填写 0 或留空 = 取消本次打卡；可输入负值（如体重、盈亏）。${item.quant.target} ${item.quant.unit} 才算达标</div>`,

function addCategory() {
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if (!name) {
    showToast('请输入分类名称');
    return;
  }
  const countInStats = document.getElementById('newCatCountInStats').checked;
  state.categories.push({
    id: genId('cat'),
    name: name,
    items: [],
    archived: false,
    countInStats: countInStats
  });
  saveData();
  input.value = '';
  document.getElementById('newCatCountInStats').checked = true; // reset to default
  renderManage();
  showToast('分类已添加');
}

function addItem(catId, input) {
  const name = input.value.trim();
  if (!name) {
    showToast('请输入打卡项名称');
    return;
  }
  const cat = state.categories.find(c => c.id === catId);
  if (cat) {
    cat.items.push({ id: genId('item'), name: name, archived: false });
    saveData();
    renderManage();
    showToast('打卡项已添加');
  }
}

function archiveCategory(catId) {
  if (!confirm('归档后该分类将不再显示在打卡页面，但历史记录会保留。可随时恢复。')) return;
  const cat = state.categories.find(c => c.id === catId);
  if (cat) {
    cat.archived = true;
    saveData();
    renderManage();
    showToast('分类已归档');
  }
}

function restoreCategory(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (cat) {
    cat.archived = false;
    saveData();
    renderManage();
    showToast('分类已恢复');
  }
}

function permanentDeleteCategory(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  if (!confirm(`确定彻底删除「${cat.name}」及其所有打卡项吗？\n\n⚠️ 此操作不可恢复，所有历史打卡记录将永久丢失！`)) return;
  if (!confirm('再次确认：真的要永久删除吗？')) return;
  // Collect all item IDs
  const itemIds = cat.items.map(i => i.id);
  state.categories = state.categories.filter(c => c.id !== catId);
  // Clean up records (supports both string and {id,value} entries)
  Object.keys(state.records).forEach(date => {
    state.records[date] = state.records[date].filter(r => !itemIds.includes(getRecordObj(r).id));
    if (state.records[date].length === 0) delete state.records[date];
  });
  saveData();
  renderManage();
  showToast('分类已彻底删除');
}

function archiveItem(catId, itemId) {
  const cat = state.categories.find(c => c.id === catId);
  if (cat) {
    const item = cat.items.find(i => i.id === itemId);
    if (item) {
      item.archived = true;
      saveData();
      renderManage();
      showToast('打卡项已归档');
    }
  }
}

function restoreItem(catId, itemId) {
  const cat = state.categories.find(c => c.id === catId);
  if (cat) {
    const item = cat.items.find(i => i.id === itemId);
    if (item) {
      item.archived = false;
      saveData();
      renderManage();
      showToast('打卡项已恢复');
    }
  }
}

function permanentDeleteItem(catId, itemId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  const item = cat.items.find(i => i.id === itemId);
  if (!item) return;
  if (!confirm(`确定彻底删除「${item.name}」吗？\n\n⚠️ 此操作不可恢复，所有历史打卡记录将永久丢失！`)) return;
  cat.items = cat.items.filter(i => i.id !== itemId);
  // Remove from records (supports both string and {id,value} entries)
  Object.keys(state.records).forEach(date => {
    state.records[date] = state.records[date].filter(r => getRecordObj(r).id !== itemId);
    if (state.records[date].length === 0) delete state.records[date];
  });
  saveData();
  renderManage();
  showToast('打卡项已彻底删除');
}

// ===== Food (calorie library) Tab =====
let foodFilter = 'all';

function foodKindLabel(kind) {
  return kind === 'drink' ? '🥤 饮品' : '🍱 食物';
}

function getFoods() {
  if (!Array.isArray(state.foods)) state.foods = [];
  return state.foods;
}

// 品牌下拉：已有品牌可直接选 +「＋ 新建品牌」
function refreshFoodBrandOptions() {
  const sel = document.getElementById('foodBrandSelect');
  if (!sel) return;
  const prev = sel.value;
  const brands = [...new Set(getFoods().map(f => (f.brand || '').trim()).filter(Boolean))];
  brands.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
  sel.innerHTML = brands.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('')
    + `<option value="__new__">＋ 新建品牌…</option>`;
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  // 仅同步“新建品牌”输入框的显隐，不抢焦点（避免每次重渲染跳焦点）
  const box = document.getElementById('foodBrandNew');
  if (box) box.style.display = (sel.value === '__new__') ? 'block' : 'none';
}

function onFoodBrandChange() {
  const sel = document.getElementById('foodBrandSelect');
  const box = document.getElementById('foodBrandNew');
  if (!sel || !box) return;
  const isNew = sel.value === '__new__';
  box.style.display = isNew ? 'block' : 'none';
  if (isNew) box.focus();
}

function setFoodFilter(kind) {
  foodFilter = kind;
  document.querySelectorAll('.food-filter-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-food-filter') === kind);
  });
  renderFoods();
}

function renderFoods() {
  const listEl = document.getElementById('foodList');
  if (!listEl) return;
  refreshFoodBrandOptions();

  const kw = ((document.getElementById('foodSearch') || {}).value || '').trim().toLowerCase();
  let foods = getFoods().slice();
  if (foodFilter !== 'all') foods = foods.filter(f => (f.kind || 'food') === foodFilter);
  if (kw) {
    foods = foods.filter(f =>
      (f.brand || '').toLowerCase().includes(kw) || (f.name || '').toLowerCase().includes(kw));
  }

  if (foods.length === 0) {
    listEl.innerHTML = `<div class="food-empty">${getFoods().length === 0 ? '还没有食物记录，点上方「＋ 新增记录」添加第一条' : '没有匹配的结果'}</div>`;
    return;
  }

  // 先按分类分组（饮品 / 食物），组内再按品牌合并成块
  let html = '';
  ['drink', 'food'].forEach(kind => {
    const inKind = foods.filter(f => (f.kind || 'food') === kind);
    if (inKind.length === 0) return;
    html += `<div class="manage-section-title" style="margin:14px 0 8px;">${foodKindLabel(kind)}</div>`;
    const brands = [...new Set(inKind.map(f => (f.brand || '').trim()))].filter(Boolean);
    brands.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
    brands.forEach(brand => {
      const rows = inKind.filter(f => (f.brand || '').trim() === brand);
      html += `<div class="food-brand-card">
        <div class="food-brand-head">
          <span>${escapeHtml(brand)}</span>
          <span class="food-brand-count">${rows.length} 项</span>
        </div>
        ${rows.map(f => `<div class="food-row">
          <span class="food-row-name">${escapeHtml(f.name)}</span>
          <span class="food-row-kcal">${f.kcal} 千卡</span>
          <button class="btn-icon" onclick="editFood('${f.id}')" title="编辑">✏️</button>
          <button class="btn-icon" onclick="deleteFood('${f.id}')" title="删除">🗑️</button>
        </div>`).join('')}
      </div>`;
    });
  });
  listEl.innerHTML = html;
}

function addFood() {
  const kindEl = document.getElementById('foodKind');
  const sel = document.getElementById('foodBrandSelect');
  const kind = (kindEl && kindEl.value) || 'food';
  const isNew = sel && sel.value === '__new__';
  const brand = isNew
    ? ((document.getElementById('foodBrandNew') || {}).value || '').trim()
    : ((sel || {}).value || '').trim();
  const nameEl = document.getElementById('foodName');
  const kcalEl = document.getElementById('foodKcal');
  const name = ((nameEl && nameEl.value) || '').trim();
  const kcalRaw = ((kcalEl && kcalEl.value) || '').replace(/[^0-9.]/g, '');
  const kcal = parseFloat(kcalRaw);

  // 返回 false 时调用方（弹窗）保持打开，方便用户改正
  if (!brand) { showToast('请选择或填写品牌'); return false; }
  if (!name) { showToast('请填写食物名称'); if (nameEl) nameEl.focus(); return false; }
  if (!kcalRaw || isNaN(kcal) || kcal < 0) { showToast('请填写正确的热量数值'); if (kcalEl) kcalEl.focus(); return false; }

  getFoods().push({ id: genId('food'), kind: kind, brand: brand, name: name, kcal: Math.round(kcal) });
  saveData();
  renderFoods();
  showToast('已添加');
  return true;
}

// 新增记录改用弹窗：点按钮才展开，页面本身只留列表
function openFoodAddModal() {
  const brands = [...new Set(getFoods().map(f => (f.brand || '').trim()).filter(Boolean))];
  brands.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
  const options = brands.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('')
    + `<option value="__new__">＋ 新建品牌…</option>`;

  openEditModal('新增食物记录', '同一品牌会自动归到同一块',
    `<label>分类</label>
     <select class="modal-input" id="foodKind">
       <option value="food">🍱 食物</option>
       <option value="drink">🥤 饮品</option>
     </select>
     <label>品牌</label>
     <select class="modal-input" id="foodBrandSelect" onchange="onFoodBrandChange()">${options}</select>
     <input class="modal-input" id="foodBrandNew" type="text" maxlength="20" placeholder="输入新品牌名称" style="display:none">
     <label>食物名称</label>
     <input class="modal-input" id="foodName" type="text" maxlength="30" placeholder="如：巨无霸">
     <label>热量（千卡）</label>
     <input class="modal-input" id="foodKcal" type="text" inputmode="numeric" placeholder="如：550">`,
    { type: 'addFood' }, '添加');

  // 一个品牌都还没有时，直接展开「新建品牌」输入框
  if (brands.length === 0) {
    const sel = document.getElementById('foodBrandSelect');
    if (sel) sel.value = '__new__';
    const box = document.getElementById('foodBrandNew');
    if (box) box.style.display = 'block';
  }
  setTimeout(() => { const el = document.getElementById('foodName'); if (el) el.focus(); }, 80);
}

function deleteFood(id) {
  const list = getFoods();
  const idx = list.findIndex(f => f.id === id);
  if (idx < 0) return;
  const f = list[idx];
  if (!confirm(`确定删除「${f.brand} · ${f.name}」吗？`)) return;
  list.splice(idx, 1);
  saveData();
  renderFoods();
  showToast('已删除');
}

function editFood(id) {
  const list = getFoods();
  const f = list.find(x => x.id === id);
  if (!f) return;
  const brands = [...new Set(list.map(x => (x.brand || '').trim()).filter(Boolean))];
  openEditModal('编辑食物', `${foodKindLabel(f.kind)} · ${f.brand}`,
    `<label>分类</label>
     <select class="modal-input" id="modalFoodKind">
       <option value="food" ${(f.kind || 'food') === 'drink' ? '' : 'selected'}>🍱 食物</option>
       <option value="drink" ${(f.kind || 'food') === 'drink' ? 'selected' : ''}>🥤 饮品</option>
     </select>
     <label>品牌</label>
     <input class="modal-input" id="modalFoodBrand" maxlength="20" list="modalFoodBrandList" value="${escapeHtml(f.brand)}">
     <datalist id="modalFoodBrandList">${brands.map(b => `<option value="${escapeHtml(b)}"></option>`).join('')}</datalist>
     <label>食物名称</label>
     <input class="modal-input" id="modalFoodName" maxlength="30" value="${escapeHtml(f.name)}">
     <label>热量（千卡）</label>
     <input class="modal-input" id="modalFoodKcal" type="text" inputmode="numeric" value="${f.kcal}">`,
    { type: 'editFood', id: id }, '保存');
}

// ===== Quant export (CSV) =====
function collectQuantItems() {
  const out = [];
  (state.categories || []).forEach(cat => {
    (cat.items || []).forEach(item => {
      if (isQuantItem(item)) out.push({ item: item, cat: cat });
    });
  });
  return out;
}

function openQuantExportModal() {
  const list = collectQuantItems();
  if (list.length === 0) { showToast('还没有量化打卡项，无法导出'); return; }
  const today = new Date();
  const s0 = new Date(today); s0.setDate(s0.getDate() - 29);
  const rows = list.map(o =>
    `<label class="export-check-row">
       <input type="checkbox" class="exp-item" value="${o.item.id}" checked>
       <span>${escapeHtml(o.item.name)} <span class="food-kind-tag">${escapeHtml(o.item.quant.unit)}</span></span>
     </label>`).join('');
  openEditModal('导出量化指标', '选择时间范围与要导出的指标',
    `<label>开始日期</label>
     <input class="modal-input" id="expStart" type="date" value="${formatDate(s0)}">
     <label>结束日期</label>
     <input class="modal-input" id="expEnd" type="date" value="${formatDate(today)}">
     <label>导出指标（默认全选）</label>
     <div class="export-check-list">${rows}</div>
     <div class="quant-input-tip">导出为 CSV：行 = 日期，列 = 指标，缺失值留空，Excel 可直接打开。</div>`,
    { type: 'quantExport' }, '导出');
}

function csvCell(v) {
  const s = (v == null) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportQuantCsv(start, end, itemIds) {
  const picked = collectQuantItems().filter(o => itemIds.indexOf(o.item.id) !== -1);
  if (picked.length === 0) { showToast('没有可导出的指标'); return; }
  const keys = [];
  const d = new Date(start);
  while (d <= end) { keys.push(formatDate(d)); d.setDate(d.getDate() + 1); }
  if (keys.length === 0) { showToast('时间范围无效'); return; }

  const header = ['日期'].concat(picked.map(o => `${o.item.name}(${o.item.quant.unit})`));
  const lines = [header.map(csvCell).join(',')];
  keys.forEach(key => {
    const recs = getDayRecords(key);
    const row = [key];
    picked.forEach(o => {
      const rec = recs.find(r => r.id === o.item.id);
      row.push(rec && isChecked(rec) ? String(rec.value) : '');
    });
    lines.push(row.map(csvCell).join(','));
  });

  // UTF-8 BOM：否则 Excel 打开中文乱码
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `量化数据_${formatDate(start)}_${formatDate(end)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${keys.length} 天 · ${picked.length} 项指标`);
}

// ===== Large trend chart (modal) =====
function fmtNum(v) {
  const r = Math.round((Number(v) || 0) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function openTrendModal(itemId) {
  const item = getItemById(itemId);
  if (!item || !isQuantItem(item)) return;
  const range = getPeriodRange(currentPeriod, statsOffset);
  const days = dailyValuesInRange(item, range.start, range.end);
  const cfg = item.quant;
  const hitFn = (cfg.compare === 'lte') ? (v => v <= cfg.target) : (v => v >= cfg.target);
  // 统计只看「有填」的天，没填的不参与平均/最高/最低
  const filled = days.map(d => d.value).filter(v => v != null);
  const hitDays = filled.filter(v => hitFn(v)).length;
  const sum = filled.reduce((a, b) => a + b, 0);
  const avg = filled.length ? sum / filled.length : 0;
  const max = filled.length ? Math.max.apply(null, filled) : 0;
  const min = filled.length ? Math.min.apply(null, filled) : 0;

  const summaryHtml = filled.length
    ? `<div class="trend-summary">
         <span>平均 ${fmtNum(avg)} ${escapeHtml(cfg.unit)}</span>
         <span>最高 ${fmtNum(max)}</span>
         <span>最低 ${fmtNum(min)}</span>
         <span>达标 ${hitDays}/${filled.length} 天</span>
       </div>`
    : `<div class="trend-empty trend-empty-lg">本区间还没有记录</div>`;

  const dirWord = (cfg.compare === 'lte') ? '低于此线达标' : '高于此线达标';
  openEditModal(`${item.name} · 趋势`, `${range.label} · 目标 ${cfg.target} ${cfg.unit}/天 · ${dirWord}`,
    `${renderTrendSvgLarge(item, days)}${summaryHtml}`,
    { type: 'trendView' }, '关闭');
}

function renderTrendSvgLarge(item, days) {
  const W = 620, H = 260, padL = 54, padB = 32, padT = 22, padR = 16;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const target = item.quant.target;
  const cmp = item.quant.compare || 'gte';
  const goodAbove = cmp !== 'lte';
  const n = days.length;
  // 没填的日子不画点也不连线（直接跳过去），避免出现掉到 0 的锯齿
  const filled = days.map((d, i) => ({ i: i, v: d.value })).filter(p => p.v != null);
  if (n === 0 || filled.length === 0) {
    return `<div class="trend-empty trend-empty-lg">本区间暂无记录</div>`;
  }

  const rng = chartRange(filled.map(p => p.v), target, { ticks: 4, goodAbove });
  const minV = rng.min, maxV = rng.max;
  const range = (maxV - minV) || 1;
  const x = i => padL + (n <= 1 ? plotW / 2 : i * plotW / (n - 1));
  const y = v => padT + plotH - ((v - minV) / range) * plotH;

  // 左侧刻度：步长已取整到 1/2/2.5/5×10^k，标签不会是 6.85 这类长小数
  let grid = '';
  rng.ticks.forEach(v => {
    const gy = y(v).toFixed(1);
    const zero = Math.abs(v) < 1e-9;
    grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="${zero ? '#d1d5db' : '#e5e7eb'}" stroke-width="${zero ? 0.9 : 0.5}"/>`;
    grid += `<text x="${padL - 8}" y="${gy}" text-anchor="end" dominant-baseline="central" font-size="10" fill="#9ca3af">${fmtTick(v, rng.step)}</text>`;
  });

  // 达标区：gte 在目标线以上、lte 在以下，淡绿一层，方向区别一眼可见
  const zoneRect = goodZoneRect(target, minV, maxV, goodAbove, y);
  const zone = zoneRect
    ? `<rect x="${padL}" y="${zoneRect.top.toFixed(1)}" width="${plotW}" height="${zoneRect.height.toFixed(1)}" fill="#059669" opacity="0.07"/>`
    : '';

  const hitFn = goodAbove ? (v => v >= target) : (v => v <= target);
  const dots = filled.map(p => {
    const hit = hitFn(p.v);
    return `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.4" fill="${hit ? '#059669' : '#d97706'}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');

  let path = '';
  filled.forEach((p, k) => {
    const px = x(p.i).toFixed(1), py = y(p.v).toFixed(1);
    path += (k === 0 ? `M ${px} ${py}` : ` L ${px} ${py}`);
  });

  let xLabels = '';
  const idxs = n === 1 ? [0] : [0, Math.floor((n - 1) / 2), n - 1];
  [...new Set(idxs)].forEach(idx => {
    xLabels += `<text x="${x(idx).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#9ca3af">${days[idx].key.slice(5)}</text>`;
  });

  // 目标线：在视野内才画；超出视野只留标注，不为它放大刻度
  const dirText = goodAbove ? '以上达标' : '以下达标';
  const dirArrow = goodAbove ? '↑' : '↓';
  let targetLine = '', labelY;
  if (rng.targetInView) {
    const ty = y(Number(target)).toFixed(1);
    const tyNum = Number(ty);
    labelY = (tyNum - 6) < (padT + 8) ? (tyNum + 14) : (tyNum - 6);
    targetLine = `<line x1="${padL}" y1="${ty}" x2="${W - padR}" y2="${ty}" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/>`;
  } else {
    labelY = rng.offHigh ? (padT + 11) : (padT + plotH - 3);
  }
  const labelText = rng.targetInView
    ? `${dirArrow} 目标 ${target} ${dirText}`
    : `${dirArrow} 目标 ${target} · 超出显示范围`;

  return `<svg class="trend-modal-svg" viewBox="0 0 ${W} ${H}" role="img">
    ${zone}
    ${grid}
    ${targetLine}
    <text x="${W - padR}" y="${labelY}" text-anchor="end" font-size="10" fill="#dc2626" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">${labelText}</text>
    <path d="${path}" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

// ===== Data Export/Import =====
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `checkin_data_${formatDate(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.categories || !data.records) throw new Error('Invalid format');
      if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state = data;
      ensureStateShape();
      saveData();
      renderCheckin();
      renderManage();
      renderFoods();
      showToast('数据已导入');
    } catch(err) {
      showToast('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAllData() {
  if (!confirm('⚠️ 此操作将清空所有打卡分类和记录，且不可恢复！确定继续吗？')) return;
  if (!confirm('再次确认：真的要清空全部数据吗？')) return;
  state = { categories: [], records: {}, foods: [] };
  saveData();
  renderCheckin();
  renderManage();
  renderFoods();
  showToast('所有数据已清空');
}

// ===== Utils =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== Init =====
function initApp() {
  loadData();
  renderCheckin();

  // Sync from cloud (pull user's data)
  syncFromCloud().then(() => {
    startPeriodicSync();
    renderCloudStatus();
    renderCheckin();
  });
}

// On page load: check if user is already logged in
currentUser = getAuthUser();
if (currentUser && getAuthSession()) {
  enterApp();
} else {
  // Not logged in, show auth overlay
  switchAuthMode('login');
  document.getElementById('authEmail').focus();
}
