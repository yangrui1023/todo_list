// ===== 饮食记录：三餐分餐 + 分餐上限 + 全天总目标 =====
/* ==========================================================================
   12 · 饮食记录（内置分类）
   三餐 + 全天合计，数据在 state.diets / dietGoals / dietMealNotes
   ========================================================================== */
function dietMealMeta(key) {
  return DIET_MEALS.find(m => m.key === key) || DIET_MEALS[1];
}

// 旧记录没有 meal 字段时归到午餐（正餐），保证历史数据不丢
function normMeal(m) {
  return DIET_MEAL_KEYS.indexOf(m) >= 0 ? m : 'lunch';
}

function getDiets() {
  if (!state.diets || typeof state.diets !== 'object') state.diets = {};
  return state.diets;
}

function getDietEntries(dateKey) {
  const all = getDiets();
  if (!Array.isArray(all[dateKey])) all[dateKey] = [];
  all[dateKey].forEach(e => {
    if (e && DIET_MEAL_KEYS.indexOf(e.meal) < 0) e.meal = 'lunch';
  });
  return all[dateKey];
}

// 三餐上限 + 全天总目标；null = 该项不设目标。total 与三餐无关，不做相加
function getDietGoals() {
  if (!state.dietGoals || typeof state.dietGoals !== 'object') {
    state.dietGoals = Object.assign({}, DIET_GOAL_DEFAULT);
  }
  const toGoal = v => (v === null || v === undefined || v === '') ? null
    : (isFinite(Number(v)) ? Number(v) : null);
  const out = {};
  DIET_MEAL_KEYS.forEach(k => { out[k] = toGoal(state.dietGoals[k]); });
  out.total = toGoal(state.dietGoals.total);
  return out;
}

// ---------- 三餐当作量化指标接进「统计 / 趋势」链路 ----------
// 三餐没有 item 记录，数据在 state.diets 里，所以用伪 item 桥接：
// 统计页、小折线图、趋势大图都复用同一套量化组件，不再另写一套图表。
const DIET_TREND_PREFIX = 'diet_';
function isDietTrendItemId(id) {
  return typeof id === 'string' && id.indexOf(DIET_TREND_PREFIX) === 0;
}
// 热量是上限 → compare 固定 lte；没设目标时 target 为 null，图里只画折线不画目标线
// mealKey 取 breakfast/lunch/dinner，或 'total'（全天合计，目标是 dietGoals.total）
function dietTrendItem(mealKey) {
  const isTotal = (mealKey === 'total');
  const m = isTotal ? { key: 'total', name: '全天合计' } : DIET_MEALS.find(x => x.key === mealKey);
  if (!m) return null;
  const goal = getDietGoals()[mealKey];
  return {
    id: DIET_TREND_PREFIX + mealKey,
    name: m.name,
    dietMeal: mealKey,
    quant: { unit: '千卡', target: (goal == null ? null : goal), compare: 'lte' }
  };
}
function resolveTrendItem(id) {
  return isDietTrendItemId(id) ? dietTrendItem(String(id).slice(DIET_TREND_PREFIX.length)) : getItemById(id);
}
// 某餐某天的摄入合计；那天没记 → null（折线跳过，不补 0）
// mealKey 为 'total' 时返回全天合计
function dietMealSumOf(dateKey, mealKey) {
  const entries = getDietEntries(dateKey);
  if (!entries || entries.length === 0) return null;
  if (mealKey === 'total') return dietTotalKcal(entries);
  const list = dietEntriesOf(entries, mealKey);
  return list.length ? dietTotalKcal(list) : null;
}

function dietEntriesOf(entries, mealKey) {
  return (entries || []).filter(e => normMeal(e.meal) === mealKey);
}

// 单条热量 = 食物热量 × 份数；存了快照，食物库里删掉也还能看到历史
function dietEntryKcal(e) {
  return Math.round((Number(e.kcal) || 0) * (Number(e.qty) || 0));
}

function dietTotalKcal(entries) {
  return (entries || []).reduce((sum, e) => sum + dietEntryKcal(e), 0);
}

// 一天三餐的汇总——打卡页、记账弹窗、「今日完成」都走这一个口径
// 饮食的「餐次状态」是这一族函数唯一的真计算：
//   mealState(date)          每餐的基本状态：entries / sum / goal / over / reached
//   visibleDietMeals(date)   打卡页显示哪几餐（有目标 或 有记录，都没有则给一餐入口）
//   dietGoalMeals()          哪几餐设了目标（等价于「打卡项」列表，与日期无关）
//   dietMealHasEntries()     只读判断某餐有没有记录（不往 state 里补空数组，供连续天数循环用）
// 除 dietMealHasEntries 外，其余都是 mealState 的投影，不要再各自重算一遍。
// 三个页面的渲染走 04c 适配器拿 tracked entry，不直接调这里。
function mealState(dateKey) {
  const entries = getDietEntries(dateKey);
  const goals = getDietGoals();
  return DIET_MEALS.map(m => {
    const list = dietEntriesOf(entries, m.key);
    const sum = dietTotalKcal(list);
    const goal = goals[m.key];
    const hasGoal = goal != null && goal > 0;
    const qtySum = list.reduce((s, e) => s + (Number(e.qty) || 0), 0);
    return {
      key: m.key,
      name: m.name,
      entries: list,
      sum: sum,
      qtySum: qtySum,
      goal: hasGoal ? goal : null,
      hasGoal: hasGoal,
      over: hasGoal && sum > goal,        // 热量是上限：超过才算超标
      reached: list.length > 0 && hasGoal && sum <= goal
    };
  });
}

function defaultDietMealIndex() {
  const h = new Date().getHours();
  return h < 10 ? 0 : (h < 15 ? 1 : 2);
}

function defaultDietMeal() {
  return DIET_MEAL_KEYS[defaultDietMealIndex()];
}

// 显示哪几餐：设了目标 或 当天有记录。全都空时按当前时段给一餐入口，
// 这样清空所有餐目标的人不会连入口都找不到。
function visibleDietMeals(dateKey) {
  const all = mealState(dateKey);
  const shown = all.filter(s => s.hasGoal || s.entries.length > 0);
  return shown.length ? shown : [all[defaultDietMealIndex()]];
}

// 设了目标的餐次 = 饮食分类的「打卡项」。分母只跟目标配置有关，不随当天记录变化
function dietGoalMeals() {
  const g = getDietGoals();
  return DIET_MEALS.filter(m => g[m.key] != null && g[m.key] > 0).map(m => m.key);
}

// 某餐是否有记录（只读，不给 state 补空数组）
function dietMealHasEntries(dateKey, mealKey) {
  const entries = getDiets()[dateKey];
  if (!Array.isArray(entries) || entries.length === 0) return false;
  if (mealKey === 'total') return true;
  return entries.some(e => normMeal(e.meal) === mealKey);
}

// 连续有记录天数：与 getStreak 同一套算法（今天没记就从昨天起算）
function getDietMealStreak(mealKey) {
  let streak = 0;
  const d = new Date();
  if (!dietMealHasEntries(formatDate(d), mealKey)) d.setDate(d.getDate() - 1);
  while (dietMealHasEntries(formatDate(d), mealKey)) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// 累计次数：与 getTotalCount 同口径（有记录的天数）
function getDietMealTotalCount(mealKey) {
  return Object.keys(getDiets()).filter(k => dietMealHasEntries(k, mealKey)).length;
}

// 每餐备注：与打卡项备注同构，按「日期 + 餐次」存
function getDietMealNote(dateKey, mealKey) {
  const day = state.dietMealNotes && state.dietMealNotes[dateKey];
  return (day && day[mealKey]) ? String(day[mealKey]) : '';
}

function setDietMealNote(dateKey, mealKey, note) {
  if (!state.dietMealNotes || typeof state.dietMealNotes !== 'object') state.dietMealNotes = {};
  const text = (note || '').trim();
  const day = state.dietMealNotes[dateKey] || {};
  if (text) day[mealKey] = text; else delete day[mealKey];
  if (Object.keys(day).length) state.dietMealNotes[dateKey] = day;
  else delete state.dietMealNotes[dateKey];
  commit();
}


function openDietMealModal(mealKey) {
  ui.diet.meal = normMeal(mealKey);
  ui.diet.view = 'detail';
  ui.diet.kw = '';
  openEditModal('', '', '<div id="dietModalInner"></div>', { type: 'dietMeal' }, '完成');
  const modal = document.getElementById('editModal');
  if (modal) modal.classList.add('diet-modal');
  renderDietModal();
}

function switchDietModalView(view) {
  ui.diet.view = view === 'picker' ? 'picker' : 'detail';
  renderDietModal();
}

function renderDietModal() {
  const inner = document.getElementById('dietModalInner');
  if (!inner) return;
  const dateKey = formatDate(ui.date);
  const s = mealState(dateKey).find(x => x.key === ui.diet.meal) || mealState(dateKey)[1];
  const titleEl = document.getElementById('editModalTitle');
  const subEl = document.getElementById('editModalSub');
  const dayText = isToday(ui.date) ? '今天' : `${ui.date.getMonth() + 1}月${ui.date.getDate()}日`;

  if (ui.diet.view === 'picker') {
    if (titleEl) titleEl.textContent = '添加食物';
    if (subEl) subEl.textContent = `${s.name} · ${dayText} · 点一下加一份`;
    inner.innerHTML = `<input class="diet-picker-search" id="dietPickerSearch" type="text"
        placeholder="搜索品牌或食物" oninput="onDietPickerSearch(this.value)">
      <div class="diet-picker-list" id="dietPickerList"></div>
      <div class="diet-picker-sum" id="dietPickerSum"></div>`;
    const kwEl = document.getElementById('dietPickerSearch');
    if (kwEl) kwEl.value = ui.diet.kw;
    renderDietPickerList();
    return;
  }

  if (titleEl) titleEl.textContent = s.name;
  if (subEl) subEl.textContent = `${dayText} · ${s.entries.length} 项 · 共 ${s.qtySum} 份`;

  const pct = s.hasGoal ? Math.min(100, Math.round(s.sum / s.goal * 100)) : 0;
  const rest = s.hasGoal ? s.goal - s.sum : 0;
  const restText = !s.hasGoal ? '未设本餐目标'
    : (rest >= 0 ? `剩余 ${rest} 千卡` : `超出 ${-rest} 千卡`);
  const restCls = !s.hasGoal ? '' : (rest >= 0 ? 'ok' : 'over');

  inner.innerHTML = `<div class="diet-modal-list">
      ${s.entries.length
        ? s.entries.map(dietRowHtml).join('')
        : '<div class="diet-empty">这一餐还没记录，点下面从食物库添加</div>'}
    </div>
    <button class="diet-modal-add" onclick="switchDietModalView('picker')">＋ 从食物库添加</button>
    <div class="diet-modal-sum">
      <div class="diet-modal-sum-top">
        <span class="diet-modal-sum-label">本餐合计</span>
        <span class="diet-modal-sum-rest ${restCls}">${restText}</span>
      </div>
      <div class="diet-modal-sum-val">${s.sum}<span class="unit">${s.hasGoal ? '/ ' + s.goal + ' 千卡' : '千卡'}</span></div>
      ${s.hasGoal ? `<div class="diet-modal-bar"><i class="${s.over ? 'over' : ''}" style="width:${pct}%"></i></div>` : ''}
    </div>`;
}

function dietRowHtml(e) {
  const brand = e.brand ? `<span class="diet-row-brand">${escapeHtml(e.brand)}</span>` : '';
  return `<div class="diet-row">
      <div class="diet-row-main"><span class="diet-row-name">${escapeHtml(e.name)}${brand}</span></div>
      <div class="diet-qty">
        <button class="diet-qty-btn" onclick="changeDietQty('${e.id}', -1)" aria-label="减一份">−</button>
        <span class="diet-qty-val">${e.qty}</span>
        <button class="diet-qty-btn" onclick="changeDietQty('${e.id}', 1)" aria-label="加一份">＋</button>
      </div>
      <span class="diet-row-kcal">${dietEntryKcal(e)} 千卡</span>
      <button class="diet-del" onclick="removeDietEntry('${e.id}')" aria-label="删除">✕</button>
    </div>`;
}

function onDietPickerSearch(v) {
  ui.diet.kw = v || '';
  renderDietPickerList();
}

function renderDietPickerList() {
  const el = document.getElementById('dietPickerList');
  if (!el) return;
  const all = getFoods();
  if (all.length === 0) {
    el.innerHTML = `<div class="diet-empty">食物库还是空的，先去「食物热量」添加</div>`;
    renderDietPickerSum();
    return;
  }
  const kw = ui.diet.kw.trim().toLowerCase();
  let foods = all.slice();
  if (kw) foods = foods.filter(f => ((f.brand || '') + ' ' + (f.name || '')).toLowerCase().indexOf(kw) >= 0);
  foods.sort((a, b) => (a.brand || '').localeCompare(b.brand || '', 'zh') || (a.name || '').localeCompare(b.name || '', 'zh'));
  if (foods.length === 0) {
    el.innerHTML = `<div class="diet-empty">没有匹配的食物</div>`;
    renderDietPickerSum();
    return;
  }
  const added = dietEntriesOf(getDietEntries(formatDate(ui.date)), ui.diet.meal).map(e => e.foodId);
  el.innerHTML = foods.map(f => `<div class="diet-picker-row" onclick="addDietByFood('${f.id}')">
      <span class="diet-picker-name"><span class="brand">${escapeHtml(f.brand || '')}</span>${escapeHtml(f.name)}</span>
      <span class="diet-picker-kcal">${f.kcal} 千卡</span>
      ${added.indexOf(f.id) >= 0
        ? '<span class="diet-picker-added">已加</span>'
        : '<span class="diet-picker-add">＋</span>'}
    </div>`).join('');
  renderDietPickerSum();
}

function renderDietPickerSum() {
  const el = document.getElementById('dietPickerSum');
  if (!el) return;
  const s = mealState(formatDate(ui.date)).find(x => x.key === ui.diet.meal);
  if (!s) return;
  el.innerHTML = `<span>${s.name} ${s.entries.length} 项 · ${s.qtySum} 份</span><span>该餐 <b>${s.sum}</b> 千卡</span>`;
}

// 同一餐里再点一次同一食物 = 份数 +1；不同餐各自独立
function addDietByFood(foodId) {
  const food = getFoods().find(f => f.id === foodId);
  if (!food) return;
  const meal = ui.diet.meal;
  const entries = getDietEntries(formatDate(ui.date));
  const exist = entries.find(e => normMeal(e.meal) === meal && e.foodId === foodId);
  if (exist) {
    exist.qty = Math.min((Number(exist.qty) || 0) + 1, 99);
  } else {
    entries.push({
      id: genId('diet'),
      meal: meal,
      foodId: food.id,
      name: food.name,
      brand: food.brand,
      kcal: Number(food.kcal) || 0,
      qty: 1
    });
  }
  commit();
  const s = mealState(formatDate(ui.date)).find(x => x.key === meal);
  showToast(s && s.hasGoal
    ? `${s.name} ${s.sum} / ${s.goal} 千卡`
    : `已添加 ${food.name} · ${s ? s.sum : 0} 千卡`);
}

function changeDietQty(entryId, delta) {
  const entries = getDietEntries(formatDate(ui.date));
  const e = entries.find(x => x.id === entryId);
  if (!e) return;
  const next = (Number(e.qty) || 0) + delta;
  if (next <= 0) { removeDietEntry(entryId); return; }
  e.qty = Math.min(next, 99);
  commit();
}

function removeDietEntry(entryId) {
  const dateKey = formatDate(ui.date);
  const entries = getDietEntries(dateKey);
  const idx = entries.findIndex(x => x.id === entryId);
  if (idx < 0) return;
  const removed = entries.splice(idx, 1)[0];
  if (entries.length === 0) delete getDiets()[dateKey];
  commit();
  showToast(`已移除 ${removed.name}`);
}

// 弹窗内部重画。不再顺手刷打卡页——那由 commit 统一负责。
function renderDietModalLive() {
  if (ui.diet.view === 'picker' && document.getElementById('dietPickerList')) {
    renderDietPickerList();
  } else if (document.getElementById('dietModalInner')) {
    renderDietModal();
  }
}

// 食物被编辑后，已记录的历史快照跟着更新（改名 / 改热量都不会让旧记录失真）
function syncDietFoodSnapshots(food) {
  const all = getDiets();
  Object.keys(all).forEach(k => {
    (all[k] || []).forEach(e => {
      if (e.foodId !== food.id) return;
      e.name = food.name;
      e.brand = food.brand;
      e.kcal = Number(food.kcal) || 0;
    });
  });
}

// 三餐上限 + 全天总目标设置（全天目标不与三餐相加联动）
function openDietGoalModal() {
  const g = getDietGoals();
  const body = DIET_MEALS.map(m => `
     <label>${m.name}目标（千卡）</label>
     <input class="modal-input" id="dietGoalInput_${m.key}" type="text" inputmode="numeric"
       placeholder="留空 = 这一餐不设目标" value="${g[m.key] == null ? '' : g[m.key]}">`).join('')
    + `<div class="diet-goal-divider"></div>
       <label>全天总目标（千卡）</label>
       <input class="modal-input" id="dietGoalInput_total" type="text" inputmode="numeric"
         placeholder="留空 = 不设全天目标" value="${g.total == null ? '' : g.total}">
       <div class="diet-goal-tip">三餐是每餐上限；全天总目标是单独设置的一条线，<b>不与三餐相加联动</b>。任一项留空表示不设该目标。</div>`;
  openEditModal('饮食目标', '三餐是每餐上限，全天目标单独设置', body, { type: 'dietGoals' }, '保存');
}

// ===== Quant export (CSV) =====
/* ==========================================================================
   13 · 数据出口：JSON 备份 · 量化 CSV 导出
   ========================================================================== */
function collectQuantItems() {
  const out = [];
  (state.categories || []).forEach(cat => {
    (cat.items || []).forEach(item => {
      if (isQuantItem(item)) out.push({ item: item, cat: cat });
    });
  });
  // 饮食的三餐 / 全天合计也是量化指标：用伪 item 并进同一份清单
  const dcat = getDietCat();
  if (dcat) {
    DIET_MEALS.concat([{ key: 'total', name: '全天合计' }]).forEach(m => {
      const item = dietTrendItem(m.key);
      if (item) out.push({ item: item, cat: dcat });
    });
  }
  return out;
}

function openQuantExportModal() {
  const list = collectQuantItems();
  if (list.length === 0) { showToast('还没有量化打卡项，无法导出'); return; }
  const today = new Date();
  const s0 = new Date(today); s0.setDate(s0.getDate() - 29);
  const rows = list.map(o =>
    `<label class="export-check-row">
       <input type="checkbox" class="exp-item" value="${o.item.id}" checked>
       <span>${escapeHtml(o.item.name)} <span class="food-kind-tag">${escapeHtml(o.item.quant.unit)}</span></span>
     </label>`).join('');
  openEditModal('导出量化指标', '选择时间范围与要导出的指标',
    `<label>开始日期</label>
     <input class="modal-input" id="expStart" type="date" value="${formatDate(s0)}">
     <label>结束日期</label>
     <input class="modal-input" id="expEnd" type="date" value="${formatDate(today)}">
     <label>导出指标（默认全选）</label>
     <div class="export-check-list">${rows}</div>
     <div class="quant-input-tip">导出为 CSV：行 = 日期，列 = 指标，缺失值留空，Excel 可直接打开。</div>`,
    { type: 'quantExport' }, '导出');
}

function csvCell(v) {
  const s = (v == null) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// 文本单元格专用：Excel / Numbers 会把 = + - @ 开头的格子当公式执行，
// 打卡项名字里写个 =HYPERLINK(...) 就是一封钓鱼邮件。数值列不要用它，
// 否则合法的负数 -5 会被写成 '-5。
function csvTextCell(v) {
  const s = (v == null) ? '' : String(v);
  return csvCell(/^[=+\-@\t\r]/.test(s) ? "'" + s : s);
}

function exportQuantCsv(start, end, itemIds) {
  const picked = collectQuantItems().filter(o => itemIds.indexOf(o.item.id) !== -1);
  if (picked.length === 0) { showToast('没有可导出的指标'); return; }
  const keys = [];
  const d = new Date(start);
  while (d <= end) { keys.push(formatDate(d)); d.setDate(d.getDate() + 1); }
  if (keys.length === 0) { showToast('时间范围无效'); return; }

  const header = ['日期'].concat(picked.map(o => `${o.item.name}(${o.item.quant.unit})`));
  const lines = [header.map(csvTextCell).join(',')];
  keys.forEach(key => {
    const recs = getDayRecords(key);
    const row = [key];
    picked.forEach(o => {
      // 饮食伪 item：值来自 state.diets，当天没记就留空
      if (o.item.dietMeal) {
        const v = dietMealSumOf(key, o.item.dietMeal);
        row.push(v == null ? '' : String(v));
        return;
      }
      const rec = recs.find(r => r.id === o.item.id);
      row.push(rec && isChecked(rec) ? String(rec.value) : '');
    });
    lines.push(row.map(csvCell).join(','));
  });

  // UTF-8 BOM：否则 Excel 打开中文乱码
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `量化数据_${formatDate(start)}_${formatDate(end)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${keys.length} 天 · ${picked.length} 项指标`);
}

// ===== Large trend chart (modal) =====
function fmtNum(v) {
  const r = Math.round((Number(v) || 0) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

/* ==========================================================================
   14 · 趋势大图 + 大尺寸折线图
   ========================================================================== */
function openTrendModal(itemId) {
  // 饮食三餐是伪 item（id 形如 diet_breakfast），走同一套趋势图
  const item = resolveTrendItem(itemId);
  if (!item) return;
  if (!isQuantItem(item) && !item.dietMeal) return;
  const range = getPeriodRange(ui.period, ui.statsOffset);
  const days = dailyValuesInRange(item, range.start, range.end);
  const cfg = item.quant;
  const hasTarget = cfg.target !== null && cfg.target !== undefined && cfg.target !== '' && isFinite(Number(cfg.target));
  const hitFn = (cfg.compare === 'lte') ? (v => v <= cfg.target) : (v => v >= cfg.target);
  // 统计只看「有填」的天，没填的不参与平均/最高/最低
  const filled = days.map(d => d.value).filter(v => v != null);
  const hitDays = hasTarget ? filled.filter(v => hitFn(v)).length : 0;
  const sum = filled.reduce((a, b) => a + b, 0);
  const avg = filled.length ? sum / filled.length : 0;
  const max = filled.length ? Math.max.apply(null, filled) : 0;
  const min = filled.length ? Math.min.apply(null, filled) : 0;

  const summaryHtml = filled.length
    ? `<div class="trend-summary">
         <span>平均 ${fmtNum(avg)} ${escapeHtml(cfg.unit)}</span>
         <span>最高 ${fmtNum(max)}</span>
         <span>最低 ${fmtNum(min)}</span>
         ${hasTarget ? `<span>达标 ${hitDays}/${filled.length} 天</span>` : ''}
       </div>`
    : `<div class="trend-empty trend-empty-lg">本区间还没有记录</div>`;

  const dirWord = (cfg.compare === 'lte') ? '低于此线达标' : '高于此线达标';
  const subTitle = hasTarget
    ? `${range.label} · 目标 ${cfg.target} ${cfg.unit}/天 · ${dirWord}`
    : `${range.label} · 未设目标 · 只看摄入走势`;
  openEditModal(`${item.name} · 趋势`, subTitle,
    `${renderTrendSvgLarge(item, days)}${summaryHtml}`,
    { type: 'trendView' }, '关闭');
}

// 趋势弹窗里的大图：同一套绘制，只是尺寸与装饰更完整
function renderTrendSvgLarge(item, days) {
  return renderTrendSvg(item, days, { large: true });
}

// ===== Data Export/Import =====
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `checkin_data_${formatDate(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.categories || !data.records) throw new Error('Invalid format');
      if (!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state = data;
      ensureStateShape();
      commit();
      showToast('数据已导入');
    } catch(err) {
      showToast('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAllData() {
  if (!confirm('⚠️ 此操作将清空所有打卡分类和记录，且不可恢复！确定继续吗？')) return;
  if (!confirm('再次确认：真的要清空全部数据吗？')) return;
  state = makeEmptyState();
  commit();
  showToast('所有数据已清空');
}

/* ==========================================================================
   15 · 渲染工具：转义 · toast
   注意：这里是全站唯一的 HTML 转义入口，两个函数分工不同：
     escapeHtml  文本节点（<span>${...}</span>）
     escAttr     属性值（value="${...}" / title="${...}"）
   浏览器把文本节点里的 " 原样保留，所以属性里必须用 escAttr，
   否则名字里带一个引号就能从 value 里逃出来接上 onfocus=...
   ========================================================================== */

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escAttr(str) {
  return escapeHtml(str == null ? '' : String(str))
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ==========================================================================
   16 · 启动：本地加载 → 拉云端 → 渲染
   ========================================================================== */

function initApp() {
  loadData();
  sync.baseFp = loadBaseFp();   // 这台设备上次与云端一致时的内容指纹
  paintCurrentTab();

  // Sync from cloud (pull user's data)
  syncFromCloud().then(() => {
    startPeriodicSync();
    renderCloudStatus();
    paintCurrentTab();
  });
}

// On page load: check if user is already logged in
sync.user = getAuthUser();
if (sync.user && getAuthSession()) {
  enterApp();
} else {
  // Not logged in, show auth overlay
  switchAuthMode('login');
  document.getElementById('authEmail').focus();
}
</script>
